let photoBackupYear='';
function carePhotosForYear(year){return D.careDays.filter(x=>x.date.startsWith(year)).flatMap(x=>x.photos.map(p=>({date:x.date,kind:p.kind,image:p.image}))).sort((a,b)=>a.date.localeCompare(b.date)||a.kind.localeCompare(b.kind))}
function carePhotoName(date,kind){return `Madar-${date}-${kind==='body'?'body':'skin'}.jpg`}
function carePhotoBlob(image){let parts=image.match(/^data:image\/jpeg;base64,([A-Za-z0-9+/]+=*)$/);if(!parts)throw Error('الصورة المحفوظة غير صالحة. نزّل نسخة JSON أولًا، ولا تستبدل بياناتك.');return new Blob([runtimeBytes(parts[1])],{type:'image/jpeg'})}
function exportCarePhoto(date,kind){let image=careRecord(date)?.photos.find(x=>x.kind===kind)?.image;if(!image||!['body','skin'].includes(kind))throw Error('لم نجد هذه الصورة في اليوم المحدد.');download(carePhotoBlob(image),carePhotoName(date,kind),'image/jpeg');toast('طُلِب تنزيل الصورة بصيغة JPG. تحقق من مجلد التنزيلات.')}
function careYears(){return [...new Set(D.careDays.filter(x=>x.photos.length).map(x=>x.date.slice(0,4)))].sort().reverse()}
function careArchive(year){if(!/^\d{4}$/.test(year))throw Error('اختر سنة من القائمة.');let photos=carePhotosForYear(year);if(!photos.length)throw Error('لا توجد صور في السنة المختارة.');let entries=photos.map(p=>[carePhotoName(p.date,p.kind),runtimeBytes(p.image.split(',')[1])]);entries.push(['اقرأني.txt',`صور مدار لسنة ${year}\nالصور في هذا الملف مستقلة بصيغة JPG ويمكن فتحها دون التطبيق.\nلإعادة السجلات داخل مدار استخدم نسخة بيانات JSON من الإعدادات.\nاحتفظ بنسخة في مكانين مستقلين، مثل الجهاز وخدمة ملفات خارجية تختارها أنت.\nتنزيل الملف لا يثبت أنه نُسخ خارج الجهاز؛ تحقق من وصوله إلى المكان الذي اخترته.\n`]);return zipFile(entries)}
function exportCareArchive(year){let blob=careArchive(year);download(blob,'Madar-photos-'+year+'.zip','application/zip');toast('طُلِب تنزيل صور '+year+'. تحقق من وجود ZIP ثم انسخه إلى مكان آخر.')}
async function shareCareArchive(year){let blob=careArchive(year),file=new File([blob],'Madar-photos-'+year+'.zip',{type:'application/zip'});if(!navigator.share||navigator.canShare&&!navigator.canShare({files:[file]})){download(blob,file.name,'application/zip');toast('المشاركة المباشرة غير مدعومة هنا؛ تحقق من تنزيل ZIP وانسخه إلى مكان آخر.');return}try{await navigator.share({files:[file],title:'نسخة صور مدار'})}catch(e){if(e.name!=='AbortError')throw e}}
function photoBackupPanel(){let years=careYears(),count=D.careDays.reduce((n,x)=>n+x.photos.length,0);photoBackupYear=years.includes(photoBackupYear)?photoBackupYear:years[0]||today().slice(0,4);return `<section class="card photoBackupPanel"><div class="cardhead"><h2>🛟 نسخة صورك خارج التطبيق</h2><span class="pill">${num(count)} صورة</span></div><p>صورك محفوظة في المتصفح وتدخل في نسخة JSON. نزّل صور السنة كملفات JPG مستقلة، ثم ضع الملف في مكان آخر تختاره مثل Google Drive أو قرص خارجي. ولإعادة كل بيانات مدار، نزّل JSON أيضًا.</p><div class="actions">${btn('تنزيل بياناتي JSON','export')}${years.length?`<label class="field"><span>سنة الصور</span><select id="photoBackupYear">${years.map(y=>`<option value="${y}" ${photoBackupYear===y?'selected':''}>${y} · ${num(carePhotosForYear(y).length)} صور</option>`).join('')}</select></label>${btn('تنزيل الصور ZIP','care-export-year',photoBackupYear,true)}${btn('مشاركة الصور إلى تطبيق آخر','care-share-year',photoBackupYear)}`:''}</div><div class="actions">${btn('أكدت حفظ ZIP وJSON خارج الجهاز','care-backup-confirm')}<small>${D.settings.photoBackupConfirmedAt?'آخر تأكيد منك: '+fmt(D.settings.photoBackupConfirmedAt.slice(0,10),true):'لم تؤكد وجود نسخة خارج الجهاز بعد.'}</small></div><div class="notice warn">لا يوجد حفظ يضمن الصور مهما حصل: مسح المتصفح أو فقدان الجهاز قد يمحو نسخ هذا الجهاز. تأكد بنفسك من وجود ZIP وJSON في مكان مستقل. الزر القديم للنسخة الصغيرة محدود بنحو ٢ ميجابايت؛ استخدم «النسخ الكبيرة المشفرة» في مساحتنا للصور الكثيرة، مع الاحتفاظ بـJSON وZIP خارج الجهاز أيضًا.</div></section>`}

const baseHomeBackup=home;home=function(){let count=D.careDays.reduce((sum,x)=>sum+x.photos.length,0),confirmed=D.settings.photoBackupConfirmedAt,stale=!confirmed||Date.now()-new Date(confirmed).getTime()>7*86400000||D.settings.photoLastChangedAt>confirmed;return baseHomeBackup()+(count&&stale?`<section class="card photoBackupReminder"><div class="cardhead"><h2>🛟 صورك تستحق نسخة ثانية</h2>${btn('احفظ الصور خارج الجهاز','care-backup-open')}</div><p>لديك ${num(count)} صورة. نزّل ZIP وJSON، ثم انقل الملفين إلى مكان مستقل قبل تأكيد النسخة.</p></section>`:'')};

document.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;try{switch(b.dataset.act){case'care-backup-confirm':D.settings.photoBackupConfirmedAt=new Date().toISOString();commit('سجلنا تأكيدك. حافظ على نسخ جديدة دوريًا.');break;case'care-export-photo':exportCarePhoto(careDate,b.dataset.id);break;case'care-export-year':exportCareArchive(photoBackupYear);break;case'care-share-year':shareCareArchive(photoBackupYear).catch(err=>toast(err.message,true));break;case'care-backup-open':go('care');document.querySelector('.photoBackupPanel')?.scrollIntoView({block:'start',behavior:'smooth'});break}}catch(err){toast(err.message,true)}});

// Authenticated, owner-only, end-to-end encrypted R2 backups. The passphrase stays in this tab.
const MB=1024*1024, cloudChunk=MB, cloudKdf=250000;let cloudSessionPassphrase=null;
function cloudStatus(message){let el=document.querySelector('#cloudLargeStatus');if(el)el.textContent=message}
function cloudBackupStore(){return new Promise((resolve,reject)=>{let req=indexedDB.open('madar-encrypted-transfers',1);req.onupgradeneeded=()=>{req.result.createObjectStore('transfers')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(Error('التخزين المحلي للرفع القابل للاستئناف غير متاح. نزّل JSON وZIP قبل مغادرة الصفحة.'))})}
async function cloudLocal(key,value){let db=await cloudBackupStore();return new Promise((resolve,reject)=>{let tx=db.transaction('transfers',value===undefined?'readonly':'readwrite');let req=value===undefined?tx.objectStore('transfers').get(key):value===null?tx.objectStore('transfers').delete(key):tx.objectStore('transfers').put(value,key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(Error('لا توجد مساحة كافية لنسخة الرفع المؤقتة. صدّر بياناتك ثم حرّر مساحة على الجهاز.'));tx.oncomplete=()=>db.close();tx.onabort=()=>db.close()})}
const cloudB64=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const cloudUnb64=value=>Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4)),x=>x.charCodeAt(0));
async function cloudHash(data){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),x=>x.toString(16).padStart(2,'0')).join('')}
async function cloudKey(password,salt){let base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:cloudUnb64(salt),iterations:cloudKdf,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function cloudFetch(path,{method='GET',json,data,checksum}={}){if(!F.session)throw Error('ادخل لحسابك أولًا.');let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{let r=await fetch(F.cfg.url+'/backups'+path,{method,signal:controller.signal,headers:{Authorization:'Bearer '+F.session.access_token,...(json?{'Content-Type':'application/json'}:{}),...(checksum?{'X-Checksum-SHA256':checksum}:{})},body:json?JSON.stringify(json):data});if(!r.ok){let error=await r.json().catch(()=>null);throw Error(error?.message||'تعذّر الاتصال بالتخزين ('+r.status+').')}return method==='PUT'||method==='DELETE'||method==='POST'||path===''?r.json():r}catch(e){if(e.name==='AbortError')throw Error('انتهت مهلة الرفع. يمكنك استئنافه عند عودة الاتصال.');throw e}finally{clearTimeout(timer)}}
function cloudLargePanel(){return `<section class="card"><h2>🔐 النسخ الكبيرة المشفرة</h2><p>نسخ مستقلة خاصة بهذا الحساب وتشمل صورك داخل بيانات مدار. يُشفّر كل جزء بكلمة مرور تختارها قبل الرفع؛ احتفظ بها في مكان آمن، فلا يستطيع الخادم استعادتها. النسخ القديمة الصغيرة ما زالت متاحة بالأزرار أعلاه.</p><div class="actions">${btn('رفع نسخة مشفرة','cloud-large-upload')}${btn('استئناف الرفع','cloud-large-resume')}${btn('عرض النسخ السابقة','cloud-large-list')}${D.settings.autoLargeBackup?btn('إيقاف النسخ التلقائي','cloud-large-auto-off'):''}</div><small>${D.settings.autoLargeBackup?'النسخ التلقائي مفعّل أثناء فتح الصفحة وبعد إدخال عبارة المرور في هذه الجلسة. آخر نجاح: '+esc(D.settings.autoLargeBackupAt||'لم يحدث بعد'):'يمكنك تفعيل النسخ التلقائي أثناء فتح التطبيق عند الرفع.'}</small><div id="cloudLargeStatus" role="status">الحد التقني: ١٢٨ ميجابايت للنسخة، ٥١٢ ميجابايت مجموعًا للحساب، بحسب سعة الخادم الفعلية. الرفع التلقائي يعمل فقط والتطبيق مفتوح ومتصل.</div></section>`}
const cloudOldFamily=familyPage;familyPage=function(){return cloudOldFamily()+(familyUID()?cloudLargePanel():'')};
async function cloudStart(password){if(password.length<12)throw Error('اختر عبارة مرور من ١٢ حرفًا على الأقل.');if(!window.indexedDB||!crypto.subtle)throw Error('التشفير أو حفظ أجزاء الرفع غير مدعوم على هذا المتصفح.');let old=await cloudLocal('pending:'+familyUID());if(old)throw Error('لديك رفع غير مكتمل. استأنفه أو احذف النسخة المعلقة من قائمة النسخ أولًا.');let payload=clone(D);payload.timer=null;payload.settings.notifications=false;validateData(payload);let bytes=new TextEncoder().encode(JSON.stringify(payload));if(bytes.length>126*MB)throw Error('النسخة أكبر من ١٢٦ ميجابايت؛ صدّر JSON وصور ZIP مؤقتًا.');let salt=cloudB64(crypto.getRandomValues(new Uint8Array(16))),key=await cloudKey(password,salt),parts=[];
 for(let i=0;i<bytes.length;i+=cloudChunk){let iv=crypto.getRandomValues(new Uint8Array(12)),encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes.subarray(i,i+cloudChunk));let part=new Uint8Array(iv.length+encrypted.byteLength);part.set(iv);part.set(new Uint8Array(encrypted),iv.length);parts.push(part.buffer)}
 let total=parts.reduce((n,x)=>n+x.byteLength,0),start=await cloudFetch('',{method:'POST',json:{bytes:total,part_count:parts.length,salt}});let pending={id:start.id,uid:familyUID(),url:F.cfg.url,parts,salt,bytes:total,at:new Date().toISOString()};await cloudLocal('pending:'+familyUID(),pending);return pending}
async function cloudResume(pending){if(!pending||pending.uid!==familyUID()||pending.url!==F.cfg.url)throw Error('لا توجد نسخة معلقة لهذا الحساب.');let manifest=await (await cloudFetch('/'+pending.id)).json();if(manifest.state==='complete'){await cloudLocal('pending:'+familyUID(),null);cloudStatus('هذه النسخة مكتملة بالفعل.');return}if(manifest.salt!==pending.salt||manifest.bytes!==pending.bytes||manifest.part_count!==pending.parts.length)throw Error('بيانات الاستئناف لا تطابق النسخة على الخادم. نزّل JSON قبل بدء نسخة جديدة.');let sent=new Map(manifest.parts.map(x=>[x.part_index,x]));for(let i=0;i<pending.parts.length;i++){let data=pending.parts[i],digest=await cloudHash(data);if(sent.get(i)?.sha256!==digest){if(!navigator.onLine)throw Error('الاتصال منقطع. بقيت أجزاء الرفع محفوظة على هذا الجهاز.');await cloudFetch('/'+pending.id+'/parts/'+i,{method:'PUT',data,checksum:digest})}cloudStatus('رفع الجزء '+num(i+1)+' من '+num(pending.parts.length))}
 let finished=await cloudFetch('/'+pending.id+'/finish',{method:'POST',json:{}});if(!finished.complete)throw Error('لم يؤكد الخادم اكتمال النسخة.');await cloudLocal('pending:'+familyUID(),null);D.settings.autoLargeBackupAt=new Date().toISOString();save();cloudStatus('اكتمل الرفع والتحقق من جميع الأجزاء · '+new Date().toLocaleString('ar-SA'));toast('نسختك المشفرة مكتملة في السحابة. احفظ عبارة المرور.');return finished}
async function cloudList(){let entries=await cloudFetch('');let total=entries.reduce((n,x)=>n+x.bytes,0);openModal('نسخي المشفرة السابقة',`<p class="full">المستخدم: ${num(Math.round(total/MB*10)/10)} م.ب · المتاح في حد الحساب: ${num(Math.max(0,Math.round((512-total/MB)*10)/10))} م.ب. هذه حصة مدار، لا المساحة الكاملة لمزود التخزين. عند امتلاء السعة، احذف نسخة قديمة بعد تنزيلها والتحقق من النسخة الجديدة.</p>${entries.length?entries.map(row=>`<div class="row"><div class="body"><b>${esc(new Date(row.completed_at).toLocaleString('ar-SA-u-ca-gregory-nu-latn'))}</b><p>${num(Math.round(row.bytes/MB*10)/10)} م.ب · ${num(row.part_count)} أجزاء</p></div><div class="actions">${row.state==='complete'?btn('معاينة واستعادة','cloud-large-restore',row.id):'<span class="pill">رفع غير مكتمل</span>'}${btn('حذف النسخة','cloud-large-delete',row.id)}</div></div>`).join(''):'<p>لا توجد نسخ كبيرة مكتملة لهذا الحساب.</p>'}`)}
async function cloudDownload(bid,password){let manifest=await (await cloudFetch('/'+bid)).json();if(manifest.state!=='complete')throw Error('النسخة غير مكتملة.');let key=await cloudKey(password,manifest.salt),chunks=[];for(let i=0;i<manifest.part_count;i++){let response=await cloudFetch('/'+bid+'/parts/'+i),data=await response.arrayBuffer(),digest=await cloudHash(data);if(digest!==manifest.parts[i]?.sha256||data.byteLength!==manifest.parts[i]?.bytes)throw Error('فشل فحص سلامة جزء '+(i+1)+'؛ لم نستبدل بياناتك.');let raw=new Uint8Array(data),plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12))}catch{throw Error('عبارة المرور غير صحيحة أو النسخة تالفة. لم نستبدل بياناتك.')}chunks.push(new Uint8Array(plain));cloudStatus('فحص الجزء '+num(i+1)+' من '+num(manifest.part_count))}let length=chunks.reduce((n,x)=>n+x.length,0),complete=new Uint8Array(length),offset=0;for(let chunk of chunks){complete.set(chunk,offset);offset+=chunk.length}let value=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(complete));validateData(value);return value}
function cloudRestore(bid){openModal('فحص النسخة قبل الاستعادة',`<p class="full">أدخل عبارة المرور لفك التشفير. لن نستبدل أي بيانات أثناء الفحص.</p><label class="field full"><span>عبارة المرور</span><input name="password" type="password" required minlength="12" autocomplete="off"></label>`,async f=>{let value=await cloudDownload(bid,f.get('password'));openModal('معاينة الاستعادة',`<div class="notice warn full">تحتوي النسخة على ${num(value.tasks?.length||0)} مهام، ${num(value.books?.length||0)} كتب و${num(value.careDays?.reduce((n,x)=>n+(x.photos?.length||0),0)||0)} صور عناية. سيُحفظ وضعك الحالي في التخزين الإضافي قبل الاستبدال. صدّر JSON الحالي أيضًا للتأكد من امتلاك نسخة خارج الجهاز.</div><div class="full">${btn('تصدير الوضع الحالي','export')}</div>`,async()=>{await cloudLocal('before-restore:'+familyUID(),JSON.stringify(D));D={...defaults(),...value,settings:{...defaults().settings,...value.settings,notifications:D.settings.notifications},timer:null};return true},'أؤكد الاستبدال');return false},'فحص ومعاينة')}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;switch(b.dataset.act){case'cloud-large-upload':openModal('رفع نسخة مشفرة',`<p class="full">احفظ عبارة مرور من ١٢ حرفًا أو أكثر خارج التطبيق. ضياعها يمنع فك النسخة. سيُحتفظ بالأجزاء المشفرة على هذا الجهاز لاستئناف الرفع.</p><label class="field full"><span>عبارة المرور</span><input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label class="togglelabel full"><input type="checkbox" name="auto">نسخ تلقائي يومي أثناء فتح التطبيق، ما دامت عبارة المرور في هذه الجلسة</label>`,async f=>{let pending=await cloudStart(f.get('password'));await cloudResume(pending);cloudSessionPassphrase=f.get('password');D.settings.autoLargeBackup=f.has('auto');return true},'تشفير ورفع');break;case'cloud-large-resume':cloudLocal('pending:'+familyUID()).then(cloudResume).catch(x=>toast(x.message,true));break;case'cloud-large-list':cloudList().catch(x=>toast(x.message,true));break;case'cloud-large-restore':cloudRestore(b.dataset.id);break;case'cloud-large-auto-off':D.settings.autoLargeBackup=false;cloudSessionPassphrase=null;commit('توقف النسخ التلقائي.');break;case'cloud-large-delete':openModal('حذف نسخة مشفرة',`<p class="full">حذف النسخة ${esc(b.dataset.id)} من خادم هذا الحساب فقط. تأكد من وجود نسخة أخرى.</p>`,async()=>{await cloudFetch('/'+b.dataset.id,{method:'DELETE'});let old=await cloudLocal('pending:'+familyUID());if(old?.id===b.dataset.id)await cloudLocal('pending:'+familyUID(),null);await cloudList();return false},'حذف نهائي');break}});
