function sortedDebts(){const totals=new Map();for(const p of D.payments)totals.set(p.debtId,(totals.get(p.debtId)||0)+p.amount);const balance=new Map(D.debts.map(d=>[d.id,Math.max(0,round(d.original+(d.cost||0)-(d.openingPaid||0)-(totals.get(d.id)||0)))]));const active=D.debts.filter(d=>balance.get(d.id)>0);return active.sort((a,b)=>D.settings.strategy==='small'?balance.get(a.id)-balance.get(b.id):D.settings.strategy==='cost'?(b.cost||0)-(a.cost||0):((a.due||'9999')>(b.due||'9999')?1:(a.due||'9999')<(b.due||'9999')?-1:0))}

 حسب الترتيب المختار، ثم يوزّع الفائض. تُفترض دفعة اليوم ثم كل شهر بنفس اليوم.</small>${installments>D.settings.budget?`<div class="notice warn">الميزانية أقل من مجموع الأقساط المقترحة (${money(installments)}). بعض الأقساط لن تُغطّى بالكامل.</div>`:''}${p.late.length?`<div class="notice warn">المبلغ الشهري لا يكفي لإنهاء ${num(p.late.length)} من الديون في مواعيدها. جرّب رفع الميزانية أو مراجعة مواعيد السداد.</div>`:''}${p.incomplete&&active.length?'<div class="notice warn">تتجاوز الخطة نطاق الحساب (100 سنة). ارفع الميزانية للحصول على تاريخ أقرب.</div>':''}${active.map(d=>`<div class="minirow"><span>${esc(d.name)}<br><small>الانتهاء: ${p.finish[d.id]?fmt(p.finish[d.id],true):'خارج نطاق التقدير'}</small></span><b>${money(p.alloc[d.id]||0)}<br><small>هذا الشهر</small></b></div>`).join('')}`:'<p class="muted">حدد مبلغًا شهريًا لتظهر خطة تقريبية وتواريخ الانتهاء.</p>'}<div class="notice">الخطة تقديرية وليست نصيحة مالية ملزمة. لا تُضاف فوائد أو رسوم دورية. التكلفة الاختيارية مبلغ ثابت تدخله أنت.</div></section>${simulationPanel(p)}<section class="card"><div class="cardhead"><h2>ميزانية شهرية مبسطة</h2>${btn('تعديل','budget-edit')}</div><div class="minirow"><span>الدخل التقريبي</span><b>${money(D.settings.income)}</b></div><div class="minirow"><span>المصاريف هذا الشهر</span><b>${money(expenses)}</b></div><div class="minirow"><span>ادخار مخطط</span><b>${money(D.settings.savings)}</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="minirow"><span>المتاح قبل السداد</span><b>${money(available)}</b></div>${D.settings.budget>Math.max(available,0)&&D.settings.income>0?'<div class="notice warn">ميزانية السداد أكبر من المتاح بعد المصاريف والادخار.</div>':''}<div class="actions">${btn('استخدام المتاح للسداد','budget-available')}${btn('تصدير السجل المالي','finance-export')}</div><small>المصاريف الشهرية المتكررة تُحسب مرة في كل شهر. الادخار هدف اختياري، وليس حركة مالية فعلية.</small></section><section class="card"><div class="cardhead"><h2>المصاريف</h2>${btn('إضافة','expense-edit','',false,'plus')}</div>${D.expenses.length?D.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="row"><div class="body"><b>${esc(e.name)}</b><p>${money(e.amount)} · ${e.recurring?'كل شهر':fmt(e.date,true)}</p></div><div class="actions"><button class="btn small" data-act="expense-edit" data-id="${e.id}">تعديل</button><button class="btn small danger" data-act="expense-delete" data-id="${e.id}">حذف</button></div></div>`).join(''):'<p class="muted">أضف مصروفًا لتقدّر المبلغ المتاح للسداد.</p>'}</section></div></div>`}
function debtCard(d,p){let r=remaining(d),payments=D.payments.filter(v=>v.debtId===d.id).sort((a,b)=>b.date.localeCompare(a.date)),schedule=repaymentSchedule(d);return `<article class="item" data-debt="${d.id}"><div class="itemtop"><div><h3 class="itemtitle">${esc(d.name)}</h3><small>الاستحقاق: ${fmt(d.due,true)}</small></div><span class="pill ${!r?'green':d.due&&d.due<today()?'red':''}">${!r?'مسدد':d.due&&d.due<today()?'تجاوز الاستحقاق':'قيد السداد'}</span></div><div class="splitnum"><div><small>المتبقي</small><b>${money(r)}</b></div><div><small>المسدد</small><b>${money(paidTotal(d))}</b></div><div><small>الأصلي${d.cost?' + التكلفة':''}</small><b>${money(d.original+(d.cost||0))}</b></div><div><small>قسط مقترح</small><b>${money(schedule?.amount||d.installment||0)}</b></div></div>${progress(paidTotal(d)/(d.original+(d.cost||0))*100)}<div class="minirow"><small>تم سداد ${num(Math.round(paidTotal(d)/(d.original+(d.cost||0))*100))}%${d.openingPaid?' · يشمل '+money(d.openingPaid)+' مسددة قبل التسجيل':''}</small>${d.cost?`<small>التكلفة المدخلة: ${money(d.cost)}</small>`:''}</div>${schedule?`<div class="notice ${schedule.overdue?'warn':''}"><b>خطة ${schedule.label}</b> · ${schedule.overdue?'انتهت مدة الخطة؛ عدّلها لتوزيع المتبقي من جديد.':'حتى '+money(schedule.amount)+' للموعد الواحد من '+num(schedule.count)+' مواعيد باقية، حتى '+fmt(d.repaymentPlan.end,true)+'.'}<br><small>تُعاد القسمة من الرصيد الفعلي كل يوم، دون تسجيل دفعة لم تحدث. موعد الاستحقاق الأصلي لا يتغيّر.${d.due&&d.repaymentPlan.end>d.due?' تنبيه: الخطة تتجاوز تاريخ الاستحقاق.':''}</small></div>`:''}<div class="itembottom"><div class="actions">${r?btn('دفعت مبلغًا','payment-new',d.id,true):''}${r?btn(schedule?'تعديل خطة السداد':'قسّم الدين','debt-plan',d.id):''}${btn('تعديل','debt-edit',d.id)}<button class="btn danger" data-act="debt-delete" data-id="${d.id}">حذف</button></div></div><details class="details"><summary>سجل الدفعات (${num(payments.length)})</summary>${payments.length?payments.map(v=>`<div class="row"><div class="body"><b>${money(v.amount)}</b><p>${fmt(v.date,true)}${v.note?' · '+esc(v.note):''}</p></div><div class="actions"><button class="btn small" data-act="payment-edit" data-id="${v.id}">تعديل</button><button class="btn small danger" data-act="payment-delete" data-id="${v.id}">حذف</button></div></div>`).join(''):'<small>لم تسجل دفعات بعد.</small>'}</details></article>`}
const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function workout(){let w=weekly(),prev=weekly(addDays(weekStart(),-7)),start=weekStart(),filter=D.exercises.filter(e=>workFilter==='all'||exerciseDays(e).includes(Number(workFilter)));return head('حركتك تصنع الفرق','خطتك الأسبوعية وجلساتك، بإيقاع يناسبك.',btn('إضافة تمرين','exercise-edit','',true,'plus'))+`<div class="stats">${stat('جلسات الأسبوع',num(w.sessions),'السابق: '+num(prev.sessions)+' جلسات','workout')}${stat('دقائق النشاط',num(w.minutes),'السابق: '+num(prev.minutes)+' دقيقة','clock')}${stat('تسلسل الالتزام',num(streak()),'أيام تمرين متصلة؛ الراحة لا تقطعها','check')}${stat('التغير الأسبوعي',num(w.minutes-prev.minutes)+' د','مقارنة بإجمالي الأسبوع الماضي','reports')}</div><div class="week">${days.map((d,i)=>`<button class="day ${i===new Date().getDay()?'today':''}" data-workfilter="${i}"><span>${d}</span><b>${parseDate(addDays(start,i)).getDate()}</b><small>${D.restDays.includes(i)?'راحة':num(D.exercises.filter(e=>exerciseDays(e).includes(i)).length)+' تمارين'}</small></button>`).join('')}</div><div class="grid2"><div class="stack"><section class="card" id="sessionPanel">${timerPanel()}</section><section class="card"><div class="cardhead"><h2>الخطة الأسبوعية</h2><button class="btn small" data-act="rest-edit">أيام الراحة</button></div><div class="toolbar"><select id="workFilter" aria-label="تصفية يوم التمرين"><option value="all">كل الأيام</option>${days.map((d,i)=>`<option value="${i}" ${String(i)===workFilter?'selected':''}>${d}</option>`).join('')}</select></div>${filter.length?filter.map(e=>exerciseCard(e)).join(''):empty('workout','خطّط لجلستك الأولى','حدد اليوم والمجموعات والهدف.','exercise-edit','إضافة تمرين')}</section></div><div class="stack"><section class="card"><div class="cardhead"><h2>سجل الجلسات</h2>${btn('تسجيل يدوي','session-manual')}</div>${D.sessions.length?limitedRows(D.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)),'sessions',s=>`<article class="row"><div class="body"><h3>${esc(s.name)}</h3><p>${fmt(s.date,true)} · ${num(s.minutes)} دقيقة · صعوبة ${num(s.difficulty)}/10</p><p>${s.sets?num(s.sets)+' مجموعات · ':''}${s.reps?num(s.reps)+' تكرار · ':''}${s.weight?num(s.weight)+' كجم':''}</p>${s.note?`<p>${esc(s.note)}</p>`:''}</div><div class="actions"><button class="btn small" data-act="session-edit" data-id="${s.id}">تعديل</button><button class="btn small" data-act="session-repeat" data-id="${s.id}">تكرار الجلسة</button><button class="btn small danger" data-act="session-delete" data-id="${s.id}">حذف</button></div></article>`):empty('workout','كل جلسة تُحتسب','ابدأ بالمؤقت أو سجّل جلسة أنجزتها.','session-manual','تسجيل جلسة')}</section><section class="card"><h2>أربعة أسابيع من الحركة</h2>${weekChart('minutes')}<small>إجمالي دقائق الجلسات المسجلة لكل أسبوع (الأحد–السبت).</small></section></div></div>`}
function exerciseCard(e){return `<div class="row"><div class="body"><h3>${esc(e.name)}</h3><p>${days[e.day]}${e.goal?' · '+esc(e.goal):''}</p><p>${e.sets?num(e.sets)+' مجموعات · ':''}${e.reps?num(e.reps)+' تكرارات · ':''}${e.minutes?num(e.minutes)+' دقيقة · ':''}${e.weight?num(e.weight)+' كجم':''}</p>${D.restDays.includes(e.day)?'<span class="pill">اليوم محدد للراحة · لن يعتبر فائتًا</span>':''}</div><div class="actions"><button class="btn small primary" data-act="session-start" data-id="${e.id}">ابدأ</button><button class="btn small" data-act="exercise-edit" data-id="${e.id}">تعديل</button><button class="btn small" data-act="exercise-copy" data-id="${e.id}">نسخ ليوم آخر</button><button class="btn small danger" data-act="exercise-delete" data-id="${e.id}">حذف</button></div></div>`}
function elapsed(t=D.timer){return t?Math.max(0,(t.elapsed||0)+(t.running?Date.now()-t.startedAt:0)):0}
function clock(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);return (h?String(h).padStart(2,'0')+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function restRemaining(){let t=D.timer;return t?Math.max(0,(t.restRemaining||0)-(t.restRunning?Date.now()-t.restStartedAt:0)):0}
function timerPanel(){let t=D.timer;if(!t)return `<div class="cardhead"><h2>جلسة اليوم</h2><span class="pill green">جاهز للحركة</span></div>${empty('clock','ابدأ مؤقتك','اختر تمرينًا من الخطة أو ابدأ جلسة حرة.','session-start','جلسة حرة')}`;return `<div class="cardhead"><h2>${esc(t.name)}</h2><span class="pill green">${t.running?'المؤقت يعمل':'متوقف مؤقتًا'}</span></div><div class="timer"><small>مدة الجلسة · تشمل الراحة</small><div class="clock" id="sessionClock">${clock(elapsed())}</div><div class="actions">${btn(t.running?'إيقاف مؤقت':'استئناف','timer-toggle')}${btn('إنهاء وتسجيل','session-finish','',true)}</div><small>يستمر الحساب عند تحديث الصفحة، ويحفظ الإيقاف المؤقت.</small></div><div class="minirow"><b>راحة بين المجموعات</b><span id="restClock">${clock(restRemaining())}</span></div><div class="actions"><button class="btn small" data-act="rest-start" data-id="30">30 ثانية</button><button class="btn small" data-act="rest-start" data-id="60">60 ثانية</button><button class="btn small" data-act="rest-start" data-id="90">90 ثانية</button>${btn(t.restRunning?'إيقاف الراحة':'استئناف الراحة','rest-toggle')}${btn('إلغاء الراحة','rest-clear')}${btn('وقت مخصص','rest-custom')}</div><div class="itembottom"><span class="pill">مجموعات منجزة: <b>${num(t.sets||0)}</b></span><div class="actions">${btn('+ مجموعة','set-plus')}${btn('− مجموعة','set-minus')}${btn('إلغاء الجلسة','timer-cancel')}</div></div>`}
function booksPage(){let books=D.books.filter(b=>bookFilter==='all'||b.status===bookFilter),reading=D.books.filter(b=>b.status==='reading').length;return head('رفّك الشخصي','احتفظ بآخر صفحة، وامنح القراءة وقتها.',btn('إضافة كتاب','book-edit','',true,'plus'))+`<div class="stats">${stat('أقرأ الآن',num(reading),'كتب قيد القراءة','book')}${stat('كتب مكتملة',num(D.books.filter(b=>b.status==='done').length),'صفحات صارت معرفة','check')}${stat('قرأت هذا الأسبوع',num(weekly().pages),'صفحات من الجلسات المسجلة','reports')}${stat('وقت القراءة',num(D.readings.reduce((s,r)=>s+r.minutes,0))+' د',num(D.readings.length)+' جلسات مسجلة','clock')}</div><div class="toolbar"><div class="tabs">${[['all','كل الكتب'],['reading','أقرأ الآن'],['done','مكتمل'],['paused','متوقف'],['queued','القادمة']].map(([k,l])=>`<button data-bookfilter="${k}" class="${bookFilter===k?'active':''}">${l}</button>`).join('')}</div></div><div class="grid2 equal">${books.length?limitedRows(books,'books|'+bookFilter,bookCard):empty('book','صفحتك الأولى تنتظر','أضف عنوان الكتاب وعدد صفحاته لتبدأ.','book-edit','إضافة أول كتاب')}</div>`}
function bookCard(b){let logs=D.readings.filter(r=>r.bookId===b.id).sort((a,c)=>c.date.localeCompare(a.date));return `<article class="item" data-book="${b.id}"><div class="itemtop"><div style="display:flex;gap:13px;align-items:center"><div class="bookcover">${icon('book')}</div><div><h3>${esc(b.title)}</h3><small>${esc(b.author||'مؤلف غير محدد')}</small><div><span class="pill ${b.status==='done'?'green':''}">${{reading:'أقرأ الآن',done:'مكتمل',paused:'متوقف مؤقتًا',queued:'قادم'}[b.status]}</span></div></div></div><b style="color:var(--brand)">${num(Math.round(b.current/b.total*100))}%</b></div>${progress(b.current/b.total*100)}<div class="minirow"><span>صفحة ${num(b.current)} من ${num(b.total)}</span><small>${num(b.total-b.current)} صفحة متبقية</small></div><div class="minirow"><small>المتوسط لكل يوم قراءة: ${num(average(b))} صفحة</small><small>${num(logs.length)} جلسات</small></div>${b.target?`<div class="notice ${b.target<today()&&b.current<b.total?'warn':''}">${b.target<today()&&b.current<b.total?'تجاوزت الموعد المستهدف؛ يمكنك تعديله.':'الهدف: '+fmt(b.target,true)}${pageGoal(b)?'<br>نحو '+num(pageGoal(b))+' صفحة يوميًا للوصول إلى هدفك.':''}</div>`:''}<div class="actions">${b.status==='queued'?btn('ابدأ القراءة','book-start',b.id):''}${b.status!=='queued'&&b.current<b.total?btn('تسجيل قراءة','reading-new',b.id,true):''}${b.status!=='queued'&&b.current<b.total?btn('+10 صفحات','reading-quick',b.id):''}${b.status!=='done'&&b.status!=='queued'?btn(b.status==='paused'?'استئناف الكتاب':'إيقاف مؤقت','book-status',b.id):''}${btn('تحديث الصفحة','book-page',b.id)}${btn('تعديل','book-edit',b.id)}<button class="btn danger" data-act="book-delete" data-id="${b.id}">حذف</button></div><details class="details"><summary>جلسات القراءة والاقتباسات (${num(logs.length)})</summary>${logs.length?logs.map(r=>`<div class="row"><div class="body"><b>من ${num(r.from)} إلى ${num(r.to)}</b><p>${fmt(r.date,true)} · ${num(r.minutes)} دقيقة · ${num(r.to-r.from)} صفحات</p>${r.note?`<p>«${esc(r.note)}»</p>`:''}</div><div class="actions"><button class="btn small" data-act="reading-edit" data-id="${r.id}">تعديل</button><button class="btn small danger" data-act="reading-delete" data-id="${r.id}">حذف</button></div></div>`).join(''):'<small>لم تُسجّل جلسة بعد.</small>'}</details></article>`}
function goalRows(w){return [['tasks','مهام مكتملة','مهمة'],['sessions','جلسات التمرين','جلسة'],['minutes','وقت النشاط','دقيقة'],['pages','صفحات القراءة','صفحة']].map(([k,l,u])=>`<div class="goal"><div class="minirow"><span>${l}</span><small>${num(w[k])} / ${num(D.goals[k])} ${u}</small></div>${progress(D.goals[k]?w[k]/D.goals[k]*100:0)}</div>`).join('')}
function weekChart(key){let weeks=[3,2,1,0].map(n=>{let s=addDays(weekStart(),-7*n);return {s,v:weekly(s)[key],n}}),max=Math.max(1,...weeks.map(w=>w.v));return `<div class="chart" role="img" aria-label="${key==='minutes'?'دقائق التمرين':'صفحات القراءة'} لأربعة أسابيع: ${weeks.map(w=>fmt(w.s)+' '+num(w.v)).join('، ')}">${weeks.map(w=>`<div class="bar ${w.n===0?'current':''}" style="height:${Math.max(2,w.v/max*75)}px"><b>${num(w.v)}</b><span>${w.n===0?'هذا الأسبوع':fmt(w.s)}</span></div>`).join('')}</div>`}
function reports(){let w=weekly(),prev=weekly(addDays(weekStart(),-7)),late=D.tasks.filter(isLate),start=weekStart();return head('أسبوعك في سطور','من '+fmt(start)+' إلى '+fmt(addDays(start,6),true),`<div class="actions">${btn('طباعة أو حفظ PDF','report-print')}${btn('تعديل الأهداف','goals-edit')}</div>`)+`<div class="grid2"><div class="stack"><section class="card"><h2>ما أنجزته</h2>${weeklyGrowthSummary()}<div class="reportnums"><div><b>${num(w.tasks)}</b><small>مهام مكتملة</small></div><div><b>${num(w.sessions)}</b><small>جلسات تمرين</small></div><div><b>${num(w.pages)}</b><small>صفحات مقروءة</small></div></div><div class="notice">${w.tasks||w.sessions||w.pages?'خطواتك هذا الأسبوع مسجلة. راجع الأهداف واضبطها حسب وقتك.':'ابدأ بإضافة مهمة أو جلسة؛ سيظهر تقريرك تلقائيًا هنا.'}</div><p class="muted">مقارنة بالأسبوع السابق: المهام ${num(w.tasks-prev.tasks>=0?w.tasks-prev.tasks:prev.tasks-w.tasks)} ${w.tasks>=prev.tasks?'أكثر':'أقل'}، والتمرين ${num(Math.abs(w.minutes-prev.minutes))} دقيقة ${w.minutes>=prev.minutes?'أكثر':'أقل'}، والقراءة ${num(Math.abs(w.pages-prev.pages))} صفحة ${w.pages>=prev.pages?'أكثر':'أقل'}.</p></section><section class="card"><h2>ما يحتاج المراجعة</h2>${late.length?sortedTasks(late).slice(0,8).map(t=>taskRow(t,true)).join(''):'<p class="muted">لا توجد مهام متأخرة حاليًا.</p>'}${late.length?btn('مراجعة المتأخر','show-overdue'):''}<div class="notice">أيام الراحة المخططة لا تظهر كمهمات فائتة. مقارنة الأسبوع الحالي بالسابق تشمل الأيام التي مرّت من هذا الأسبوع.</div></section><section class="card"><h2>تقدم القراءة</h2>${weekChart('pages')}</section></div><section class="card"><div class="cardhead"><h2>أهداف أسبوعية</h2>${btn('تعديل','goals-edit')}</div>${goalRows(w)}<small>الأسبوع يبدأ يوم الأحد. الأهداف تتجدد حسابيًا كل أسبوع، وتبقى سجلاتك محفوظة.</small></section></div>`}
function settings(){return head('إعدادات مساحتك','تحكّم في المظهر والنسخ الاحتياطي والتذكيرات.')+personalStoragePanel()+`<section class="card" style="margin-bottom:20px"><h2>اسمك وترحيبك</h2><p class="subtitle">${esc(D.settings.profileName||'لم يُحدد الاسم بعد')}</p>${btn('تعديل اسمي','profile-name')}</section>`+`<div class="settingsgrid"><section class="card"><h2>المظهر والعملة</h2><div class="formgrid" style="margin-top:20px"><label class="field full"><span>المظهر</span><select id="themeSelect"><option value="light" ${D.settings.theme==='light'?'selected':''}>فاتح</option><option value="dark" ${D.settings.theme==='dark'?'selected':''}>داكن</option></select></label><label class="field full"><span>عملة العرض</span><select id="currency">${[['SAR','ريال سعودي'],['KWD','دينار كويتي'],['AED','درهم إماراتي'],['USD','دولار أمريكي'],['EUR','يورو'],['JOD','دينار أردني'],['EGP','جنيه مصري'],['BHD','دينار بحريني'],['QAR','ريال قطري'],['OMR','ريال عُماني']].map(([k,l])=>`<option value="${k}" ${D.settings.currency===k?'selected':''}>${l} (${k})</option>`).join('')}</select><small>تغيير الرمز فقط؛ لا يتم تحويل المبالغ بسعر صرف.</small></label></div></section><section class="card"><h2>التذكيرات والإشعارات</h2><p class="subtitle">التنبيهات داخل التطبيق تعمل أثناء فتحه. إشعارات الجهاز اختيارية.</p><div class="notice warn">تذكيرات المهام ومواعيد التقويم تعمل أثناء فتح التطبيق؛ أضف الموعد إلى تقويم جهازك للتنبيه عند إغلاقه. تنبيهات الشريك الفورية تستخدم Web Push عند تفعيلها، وتظل خاضعة لإعدادات النظام والاتصال.</div><div class="actions" style="margin-top:15px">${btn(D.settings.notifications?'إيقاف إشعارات الجهاز':'تفعيل إشعارات الجهاز','notifications-toggle')}${btn('مركز التنبيهات','notices')}</div><small>لا نطلب الإذن إلا عند ضغط زر التفعيل. عند إعادة فتح التطبيق تظهر التذكيرات المستحقة التي لم تُقرأ.</small></section><section class="card"><h2>البيانات والنسخ الاحتياطي</h2><p class="subtitle">النسخة الفردية محفوظة في هذا المتصفح. قسم مساحتنا يضيف حسابًا اختياريًا ومشاركة مختارة بين الجهازين، ونسخة سحابية خاصة ترفعها وتنزلها يدويًا.</p><div class="actions" style="margin:18px 0">${btn('تصدير نسخة JSON','export','',false,'export')}${btn('استيراد نسخة','import')}${btn('سلة المحذوفات','trash')}${btn('تحديث البيانات','sync-latest')}</div><small>آخر تصدير: ${D.settings.lastExport?esc(new Date(D.settings.lastExport).toLocaleString('ar-SA-u-ca-gregory-nu-latn')):'لم تُصدّر نسخة بعد'}</small><div class="notice">للنقل إلى جهاز آخر: صدّر الملف ثم استورده هناك. الاستيراد يستبدل البيانات بعد عرض ملخص للتأكيد. نوصي بنسخة دورية؛ حذف بيانات المتصفح أو التصفح الخاص قد يزيل الحفظ. حافظ على نفس اسم ومكان ملف HTML عند فتحه محليًا.</div>${recoveryRaw?'<div class="notice warn">يوجد حفظ سابق تعذّرت قراءته. يمكنك تنزيله للاحتفاظ به. '+btn('تنزيل الحفظ السابق','recovery-export')+'</div>':''}<small>الحفظ: ${storageOK?'متاح':'غير متاح'} · الإصدار 5.0 · الاتصال السحابي اختياري من مساحتنا</small></section><section class="card"><h2>استخدام سريع</h2><div class="row"><span class="pill green">1</span><p>ابدأ من زر الإضافة في أي قسم، ثم احفظ بياناتك.</p></div><div class="row"><span class="pill green">2</span><p>سجّل الدفعات والجلسات بدل تعديل الإجماليات؛ يحسب مدار التقدم تلقائيًا.</p></div><div class="row"><span class="pill green">3</span><p>راجع الصفحة الرئيسية يوميًا والتقرير أسبوعيًا. البحث العلوي يشمل كل الأقسام.</p></div><div class="actions" style="margin-top:16px">${btn('التقرير الأسبوعي','go-reports')}${btn('تعديل الأهداف','goals-edit')}${btn('الاختصارات والمساعدة','shortcuts')}${btn('التحفيز والتشجيع','motivation-settings')}</div></section></div>`}
function searchPage(){let q=searchText.trim().toLocaleLowerCase('ar'),hit=(...s)=>s.join(' ').toLocaleLowerCase('ar').includes(q);let groups=[['المهام',D.tasks.filter(t=>hit(t.title,t.description,t.category)),t=>taskRow(t)],['الديون',D.debts.filter(d=>hit(d.name)),d=>`<div class="row"><div class="body"><b>${esc(d.name)}</b><p>${money(remaining(d))} متبقية</p></div>${btn('عرض وتعديل','debt-edit',d.id)}</div>`],['التمارين',D.exercises.filter(e=>hit(e.name,e.goal)),exerciseCard],['الكتب',D.books.filter(b=>hit(b.title,b.author)),b=>`<div class="row"><div class="body"><b>${esc(b.title)}</b><p>${esc(b.author)} · ${num(b.current)}/${num(b.total)} صفحة</p></div>${btn('عرض وتعديل','book-edit',b.id)}</div>`],['المصاريف',D.expenses.filter(e=>hit(e.name)),e=>`<div class="row"><b>${esc(e.name)} · ${money(e.amount)}</b>${btn('تعديل','expense-edit',e.id)}</div>`]];groups.push(['العادات',D.habits.filter(h=>hit(h.title,h.unit)),habitCard],['الأهداف الشخصية',D.personalGoals.filter(g=>hit(g.title,g.why,g.nextStep)),personalGoalCard],['إنجازات الأيام',D.wins.filter(x=>hit(x.text)),winCard]);return head('نتائج البحث','بحث عن «'+esc(searchText)+'»')+groups.filter(g=>g[1].length).map(([l,arr,fn])=>`<section class="card resultgroup"><h3>${l} (${num(arr.length)})</h3>${limitedRows(arr,'search|'+l+'|'+q,fn)}</section>`).join('')+(groups.every(g=>!g[1].length)?empty('search','لم نجد نتائج','جرّب كلمة أخرى من العنوان أو الوصف.','',''):'')}

function motiveCategory(){let mode=D.settings.motivationMode||'auto';if(mode!=='auto')return motivationWords[mode]?mode:'general';if(currentPage==='workout'&&D.restDays.includes(new Date().getDay()))return 'rest';return motivationWords[currentPage]?currentPage:'general'}
function motiveText(){let category=motiveCategory(),bank=motivationWords[category],hash=[...today()+category].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0);return bank[(hash+quoteOffset)%bank.length]}
function motivationPanel(){if(D.settings.motivation===false)return '';return `<aside class="motive" aria-label="عبارة تحفيزية"><span class="motiveMark" aria-hidden="true">✦</span><div class="body"><small>${D.settings.customQuote?'عبارتك الشخصية':'تذكير لطيف لك'}</small><p id="motiveText">${esc(D.settings.customQuote||motiveText())}</p>${D.settings.customQuote?`<small>${esc(motiveText())}</small>`:''}</div><div class="actions">${btn('عبارة أخرى','motive-next')}${btn('تخصيص','motivation-settings')}</div></aside>`}
function motivationSettings(){openModal('التحفيز على طريقتك',`<label class="togglelabel full"><input type="checkbox" name="enabled" ${D.settings.motivation!==false?'checked':''}>إظهار العبارات التحفيزية</label><label class="togglelabel full"><input type="checkbox" name="success" ${D.settings.successMessages!==false?'checked':''}>تشجيع قصير عند تسجيل إنجاز</label>`+field('mode','نوع العبارات',D.settings.motivationMode||'auto','select',{full:true,options:[['auto','حسب القسم تلقائيًا'],['general','تشجيع عام'],['tasks','المهام والإنجاز'],['money','تنظيم المال'],['workout','التمرين'],['book','القراءة'],['growth','الأهداف والعادات']]})+field('custom','عبارة شخصية تظهر لك دائمًا (اختياري)',D.settings.customQuote||'','textarea',{full:true,hint:'حتى 300 حرف. اتركها فارغة لاستخدام العبارات المتغيرة.'})+'<p class="full muted">العبارات مكتوبة للتشجيع وليست اقتباسات منسوبة لأشخاص. تتغير يوميًا، ويمكنك تغييرها بزر «عبارة أخرى».</p>',f=>{let custom=str(f,'custom');if(custom.length>300)throw Error('اجعل عبارتك 300 حرف أو أقل.');D.settings.motivation=f.has('enabled');D.settings.successMessages=f.has('success');D.settings.motivationMode=str(f,'mode');D.settings.customQuote=custom;return true})}
function queueEncouragement(kind){setTimeout(()=>{if(D.settings.successMessages===false||!storageOK||pendingExternal)return;const text={tasks:'أنجزت خطوة من يومك. أحسنت المتابعة.',money:'دفعتك مسجلة، وصورة السداد أوضح الآن.',workout:'سجّلت وقتك وجهدك. كل جلسة تُحتسب.',book:'صفحات جديدة أصبحت جزءًا من رحلتك.',habit:'وصلت إلى هدف العادة لهذا اليوم. خطوة تستحق التقدير.',goal:'وصلت إلى هدفك الشخصي. امنح هذا الإنجاز حقه.',win:'احتفظت بأثر جميل من يومك.'}[kind];if(text)toast('✦ '+text)},0)}
function scheduledHabit(h,date=today()){return !h.paused&&date>=h.startDate&&h.days.includes(parseDate(date).getDay())}
function habitAmount(h,date=today()){return D.habitLogs.find(x=>x.habitId===h.id&&x.date===date)?.amount||0}
function habitStreak(h){let date=today(),count=0;if(habitAmount(h,date)<h.target&&h.days.includes(parseDate(date).getDay()))date=addDays(date,-1);for(let i=0;i<36500&&date>=h.startDate;i++,date=addDays(date,-1)){if(!h.days.includes(parseDate(date).getDay()))continue;if(habitAmount(h,date)>=h.target)count++;else break}return count}
function habitWeek(){let expected=0,met=0;for(let h of D.habits.filter(h=>!h.paused))for(let date=weekStart();date<=today();date=addDays(date,1))if(scheduledHabit(h,date)){expected++;if(habitAmount(h,date)>=h.target)met++}return {expected,met}}
function dailyGrowthPanel(){let active=D.habits.filter(h=>scheduledHabit(h)),complete=active.filter(h=>habitAmount(h)>=h.target).length,win=D.wins.find(x=>x.date===today());return `<section class="card dailyGrowth"><div class="cardhead"><div><h2>خطوة لنفسك اليوم</h2><small>${active.length?num(complete)+' من '+num(active.length)+' عادات مكتملة':'ابدأ بعادة بسيطة أو احتفظ بإنجاز من يومك.'}</small></div><div class="actions">${btn('تطوّري وأهدافي','growth-open')}${btn(win?'تعديل إنجاز اليوم':'إنجاز اليوم','win-edit')}</div></div>${active.length?active.slice(0,3).map(h=>`<div class="minirow"><span><b>${esc(h.title)}</b><br><small>${num(habitAmount(h))} / ${num(h.target)} ${esc(h.unit)}</small></span>${habitAmount(h)>=h.target?'<span class="pill green">مكتملة</span>':btn('+ '+num(h.step),'habit-plus',h.id)}</div>`).join(''):''}${win?`<p class="winText">${esc(win.text)}</p>`:''}</section>`}
function growthPage(){let scheduled=D.habits.filter(h=>scheduledHabit(h)),week=habitWeek(),earned=badges().filter(b=>b.met).length;return head('تطوّرك يستحق أن تراه','عادات تناسب أيامك، وأهداف لها معنى، وإنجازات تحتفظ بها.',`<div class="actions">${btn('عادة جديدة','habit-edit','',true,'plus')}${btn('هدف شخصي','personal-goal-edit')}</div>`)+`<div class="stats">${stat('عادات اليوم المكتملة',num(scheduled.filter(h=>habitAmount(h)>=h.target).length)+' / '+num(scheduled.length),'الأيام غير المجدولة لا تُحسب فائتة','check')}${stat('التزام هذا الأسبوع',week.expected?num(Math.round(week.met/week.expected*100))+'%':'—',num(week.met)+' من '+num(week.expected)+' مرات مجدولة حتى اليوم','reports')}${stat('أهداف شخصية مكتملة',num(D.personalGoals.filter(g=>g.current>=g.target).length),'من '+num(D.personalGoals.length)+' أهداف','calendar')}${stat('أوسمة من سجلاتك',num(earned),'تشجيع على ما أنجزته فعليًا','home')}</div><div class="growthGrid"><div class="stack"><section class="card"><div class="cardhead"><h2>عاداتي</h2>${btn('إضافة عادة','habit-edit')}</div>${D.habits.length?D.habits.map(habitCard).join(''):empty('check','عادة صغيرة، تتكرر على طريقتك','حدد الهدف والأيام. لن نضيف أي عادة إلى بياناتك تلقائيًا.','habit-edit','أنشئ أول عادة')}<small>نسبة الأسبوع تعتمد العادات النشطة وجدولها الحالي من الأحد حتى اليوم. يمكنك تعديل الأيام أو إيقاف العادة مؤقتًا.</small></section><section class="card"><div class="cardhead"><h2>أهداف لها معنى</h2>${btn('إضافة هدف','personal-goal-edit')}</div>${D.personalGoals.length?D.personalGoals.map(personalGoalCard).join(''):empty('reports','ما الذي تريد الوصول إليه؟','حدد الهدف وسبب أهميته وأصغر خطوة تالية.','personal-goal-edit','أضف هدفك الأول')}</section></div><div class="stack"><section class="card"><div class="cardhead"><h2>إنجاز صغير من يومك</h2>${btn('اكتب إنجازًا','win-edit')}</div>${D.wins.length?D.wins.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(winCard).join(''):empty('edit','ما الشيء الذي فعلته اليوم؟','قد يكون مهمة أنهي function habitCard(h){let amount=habitAmount(h),scheduled=scheduledHabit(h),met=amount>=h.target;return `<article class="item" style="margin-bottom:13px" data-habit="${h.id}"><div class="itemtop"><div><h3>${esc(h.title)}</h3><small>${h.paused?'متوقفة مؤقتًا':scheduled?'مجدولة اليوم':'غير مجدولة لهذا اليوم'}</small></div><span class="pill ${met?'green':''}">${met?'هدف اليوم مكتمل':num(habitStreak(h))+' أيام التزام'}</span></div><div class="minirow"><span class="habitValue">${num(amount)} / ${num(h.target)}</span><small>${esc(h.unit)}</small></div>${progress(amount/h.target*100)}<div class="habitDays" aria-label="سجل الأسبوع">${days.map((day,i)=>{let date=addDays(weekStart(),i),active=date>=h.startDate&&h.days.includes(i),done=habitAmount(h,date)>=h.target;return `<span title="${day} · ${fmt(date)} · ${done?'مكتملة':active?'مجدولة':'غير مجدولة'}" class="${done?'met':!active||date>today()?'inactive':''}">${done?'✓':day.slice(0,1)}</span>`}).join('')}</div><div class="actions">${scheduled?btn('+ '+num(h.step)+' '+esc(h.unit),'habit-plus',h.id,true):''}${scheduled&&amount>0?btn('− '+num(h.step),'habit-minus',h.id):''}${btn('تسجيل يوم','habit-log',h.id)}${btn(h.paused?'استئناف':'إيقاف','habit-pause',h.id)}${btn('تعديل','habit-edit',h.id)}<button type="button" class="btn danger" data-act="habit-delete" data-id="${h.id}">حذف</button></div></article>`}
function editHabit(id){let h=D.habits.find(h=>h.id===id)||{title:'',target:1,unit:'مرة',step:1,days:[0,1,2,3,4,5,6],startDate:today(),paused:false};openModal(id?'تعديل العادة':'عادة جديدة',field('title','اسم العادة',h.title,'text',{required:true,full:true})+field('target','الهدف في اليوم المجدول',h.target,'number',{required:true,min:0.01})+field('unit','الوحدة (مرة، صفحة، كوب…)',h.unit,'text',{required:true})+field('step','الزيادة عند الضغط على +',h.step,'number',{required:true,min:0.01})+field('startDate','بداية المتابعة',h.startDate,'date',{required:true})+'<p class="full muted">اختر أيام المتابعة؛ بقية الأيام لا تظهر كالتزام فائت.</p>'+days.map((d,i)=>`<label class="togglelabel"><input type="checkbox" name="day${i}" ${h.days.includes(i)?'checked':''}>${d}</label>`).join(''),f=>{let selected=days.map((_,i)=>i).filter(i=>f.has('day'+i));if(!selected.length)throw Error('اختر يومًا واحدًا على الأقل.');let startDate=validDate(str(f,'startDate'),'بداية المتابعة');if(D.habitLogs.some(l=>l.habitId===id&&l.date<startDate))throw Error('توجد سجلات قبل تاريخ البداية الجديد. اختر تاريخًا يضم سجلاتك.');let v={...h,id:id||uid(),title:required(f,'title','اسم العادة'),target:positive(nval(f,'target'),'لهدف العادة'),unit:required(f,'unit','الوحدة'),step:positive(nval(f,'step'),'للزيادة'),days:selected,startDate};if(id)D.habits[D.habits.indexOf(h)]=v;else D.habits.push(v);return true})}
function setHabitAmount(h,date,amount){let old=D.habitLogs.find(l=>l.habitId===h.id&&l.date===date),before=old?.amount||0;amount=positive(amount,'لإنجاز العادة',true);if(amount===0)D.habitLogs=D.habitLogs.filter(l=>l.id!==old?.id);else if(old)old.amount=amount;else D.habitLogs.push({id:uid(),habitId:h.id,date,amount});if(before<h.target&&amount>=h.target)queueEncouragement('habit')}
function logHabit(id){let h=D.habits.find(h=>h.id===id);if(!h)return;openModal('تسجيل عادة · '+h.title,field('date','تاريخ الإنجاز',today(),'date',{required:true,min:h.startDate,max:today()})+field('amount','المنجز ('+esc(h.unit)+')',habitAmount(h),'number',{required:true,min:0})+'<p class="full muted">تسجيل صفر يزيل تسجيل ذلك اليوم. الأيام غير المجدولة لا تدخل في نسبة الالتزام.</p>',f=>{let date=validDate(str(f,'date'),'الإنجاز');if(date>today()||date<h.startDate)throw Error('اختر تاريخًا من بداية المتابعة إلى اليوم.');setHabitAmount(h,date,nval(f,'amount'));return true});$('#modal').dataset.habitId=id}
function personalGoalCard(g){let done=g.current>=g.target;return `<article class="item" style="margin-bottom:13px" data-personal-goal="${g.id}"><div class="itemtop"><h3>${esc(g.title)}</h3><span class="pill ${done?'green':''}">${done?'مكتمل':g.paused?'متوقف':'قيد التقدم'}</span></div>${g.why?`<p class="goalWhy">لماذا يهمك؟ ${esc(g.why)}</p>`:''}<div class="minirow"><b>${num(g.current)} / ${num(g.target)} ${esc(g.unit)}</b><small>${num(Math.round(g.current/g.target*100))}%</small></div>${progress(g.current/g.target*100)}${g.deadline?`<small>${g.deadline<today()&&!done?'راجع الموعد المستهدف: ':'الهدف بحلول: '}${fmt(g.deadline,true)}</small>`:''}${g.nextStep?`<p class="subtitle">الخطوة التالية: ${esc(g.nextStep)}</p>`:''}<div class="actions" style="margin-top:14px">${!done&&!g.paused?btn('تسجيل تقدم','personal-goal-progress',g.id,true):''}${!done?btn('تحويل الخطوة إلى مهمة','goal-to-task',g.id):''}${btn('تعديل','personal-goal-edit',g.id)}<button type="button" class="btn danger" data-act="personal-goal-delete" data-id="${g.id}">حذف</button></div><small>التقدم يُدخل يدويًا؛ لا يتغير تلقائيًا من الأقسام الأخرى.</small></article>`}
function editPersonalGoal(id){let g=D.personalGoals.find(g=>g.id===id)||{title:'',why:'',target:10,current:0,unit:'خطوة',deadline:'',nextStep:'',paused:false};openModal(id?'تعديل الهدف':'هدف شخصي جديد',field('title','ما هدفك؟',g.title,'text',{required:true,full:true})+field('why','لماذا يهمك هذا الهدف؟',g.why,'textarea',{full:true})+field('target','العدد المستهدف',g.target,'number',{required:true,min:0.01})+field('current','التقدم الحالي',g.current,'number',{required:true,min:0})+field('unit','الوحدة (صفحة، جلسة، ريال…)',g.unit,'text',{required:true})+field('deadline','موعد مستهدف (اختياري)',g.deadline,'date')+field('nextStep','أصغر خطوة تالية',g.nextStep,'text',{full:true})+`<label class="togglelabel full"><input type="checkbox" name="paused" ${g.paused?'checked':''}>إيقاف الهدف مؤقتًا</label>`,f=>{let target=positive(nval(f,'target'),'للعدد المستهدف'),current=positive(nval(f,'current'),'للتقدم',true);if(current>target)throw Error('التقدم الحالي أكبر من الهدف. عدّل الهدف أو القيمة.');let v={id:id||uid(),title:required(f,'title','عنوان الهدف'),why:str(f,'why'),target,current,unit:required(f,'unit','الوحدة'),deadline:validDate(str(f,'deadline'),'الهدف',true),nextStep:str(f,'nextStep'),paused:f.has('paused')};if(id)D.personalGoals[D.personalGoals.indexOf(g)]=v;else D.personalGoals.push(v);if(current>=target&&g.current<g.target)queueEncouragement('goal');return true})}
function progressPersonalGoal(id){let g=D.personalGoals.find(g=>g.id===id);if(!g)return;openModal('خطوة نحو · '+g.title,`<div class="notice full">المتبقي: ${num(g.target-g.current)} ${esc(g.unit)}</div>`+field('amount','مقدار التقدم الجديد',Math.min(1,g.target-g.current),'number',{required:true,min:0.01,max:round(g.target-g.current),full:true}),f=>{let amount=positive(nval(f,'amount'),'للتقدم');if(round(g.current+amount)>g.target)throw Error('هذا المقدار يتجاوز الهدف. عدّل الهدف أولًا إذا احتجت.');g.current=round(g.current+amount);if(g.current>=g.target)queueEncouragement('goal');return true})}
function goalToTask(id){let g=D.personalGoals.find(g=>g.id===id);if(!g)return;editTask();$('#f_title').value=g.nextStep||'خطوة نحو '+g.title;$('#f_description').value='مرتبط بهدفك: '+g.title+(g.why?'\nالسبب: '+g.why:'');$('#f_category').value='أهدافي';modalDirty=true;$('#modalTitle').textContent='خطوة من هدفك · راجعها واحفظها'}
const moods=['دون تقييم','متعب','أقل من المعتاد','عادي','جيد','ممتاز'];

function familyTaskCard(t){let late=!t.done&&t.due_date<today();return `<article class="row"><button class="check ${t.done?'done':''}" data-act="family-task-toggle" data-id="${esc(t.id)}" aria-label="${t.done?'إعادة فتح':'إكمال'} المهمة المشتركة">${t.done?icon('check'):''}</button><div class="body"><h3 class="${t.done?'completed':''}">${esc(t.title)}</h3>${t.description?`<p>${esc(t.description)}</p>`:''}<div class="pills"><span class="pill ${late?'red':''}">${fmt(t.due_date,true)}${t.due_time?' · '+esc(t.due_time.slice(0,5)):''}</span><span class="pill">المسؤول: ${t.assigned_to?esc(t.assigned_to===familyUID()?'أنا':familyName(t.assigned_to)):'معًا'}</span></div></div><div class="actions">${btn('تعديل','family-task-edit',t.id)}${btn('حذف','family-task-delete',t.id)}</div></article>`}
function partnerPanel(peer){let row=F.snapshots.find(s=>s.user_id===peer),s=row?.payload;return `<section class="card"><div class="cardhead"><h2>مهام وتقدم ${esc(familyName(peer))}</h2><span class="pill">عرض فقط</span></div>${!s?'<p class="muted">لم ينشر الشريك بياناته بعد. يظهر فقط ما وافق على مشاركته.</p>':`<small>آخر نشر: ${esc(new Date(row.updated_at).toLocaleString('ar-SA-u-ca-gregory-nu-latn'))}${s.day&&s.day!==today()?' · هذه نسخة ليوم '+esc(s.day):''}</small>${s.scopes?.progress?`<div class="reportnums"><div><b>${num(s.stats?.tasks)}</b><small>مهام الأسبوع</small></div><div><b>${num(s.stats?.sessions)}</b><small>جلسات الأسبوع</small></div><div><b>${num(s.stats?.pages)}</b><small>صفحات الأسبوع</small></div></div>`:''}${s.scopes?.tasks?`<h3 style="margin-top:15px">المهام التي اختار مشاركتها</h3>${(s.tasks||[]).length?s.tasks.slice(0,100).map(t=>`<div class="row"><span class="pill ${t.done?'green':''}">${t.done?'✓':'○'}</span><div class="body"><b class="${t.done?'completed':''}">${esc(t.title)}</b><p>${esc(t.date||'')} ${esc(t.time||'')}</p>${t.description?`<p>${esc(t.description)}</p>`:''}</div></div>`).join(''):'<p class="muted">لا توجد مهام مشاركة.</p>'}`:''}${s.scopes?.finance?partnerFinancePanel(s.finance):''}${[['books','الكتب','total'],['habits','عادات اليوم','target'],['goals','الأهداف الشخصية','target']].map(([k,label,target])=>s.scopes?.[k]?`<h3 style="margin-top:15px">${label}</h3>${(s[k]||[]).map(x=>`<div class="minirow"><span>${esc(x.title)}<br><small>${num(x.current)} / ${num(x[target])} ${esc(x.unit||'صفحة')}</small></span><b>${num(Math.round((Number(x.current)||0)/Math.max(.01,Number(x[target])||1)*100))}%</b></div>`).join('')||'<p class="muted">لا توجد بيانات مشاركة.</p>'}`:'').join('')}`}</section>`}
function familyHomePanel(){if(!familyUID()||!F.familyId)return '';let due=F.tasks.filter(t=>!t.done&&t.due_date<=today());return weddingBanner()+`<section class="card dailyGrowth"><div class="cardhead"><div><h2>مساحتنا معًا</h2><small>${familyPartner()?esc(familyName(familyPartner())):'بانتظار انضمام الشريك'} · ${num(due.length)} مهام مشتركة لليوم أو متأخرة</small></div><div class="actions">${btn('تقويمنا','family-calendar')}${btn('فتح المساحة','family-open')}</div></div><small>${esc(familyStatusText())}</small></section>`}
let familyCalendarMonth=today().slice(0,7);
function annualDate(source,year){const original=parseDate(source),month=original.getMonth(),last=new Date(year,month+1,0).getDate();return localDate(new Date(year,month,Math.min(original.getDate(),last),12))}
function nextSharedDate(event,from=today()){if(!event.annual)return event.date;const y=parseDate(from).getFullYear();let date=annualDate(event.date,y);if(date<from)date=annualDate(event.date,y+1);return date<event.date?event.date:date}
function occursShared(event,date){return event.date===date||event.annual&&date>=event.date&&annualDate(event.date,parseDate(date).getFullYear())===date}
function weddingEvent(){return F.events.find(e=>e.kind==='wedding')}

function weddingMessage(event){const target=nextSharedDate(event),days=diffDays(target,today()),anniversary=event.date<today()&&event.annual;let entry=0;try{entry=Math.max(0,(Number(localStorage.getItem('madar.love.counter.'+KEY))||1)-1)}catch{}const key=days<0?'past':days===0?'today':anniversary?'anniversary':days<=7?'week':days<=30?'month':days<=90?'season':'far',group=WEDDING_PHRASES[key];return group[entry%group.length]}
function weddingBanner(compact=false){const event=weddingEvent();if(!event)return '';const target=nextSharedDate(event),days=diffDays(target,today()),anniversary=event.annual&&event.date<today(),title=anniversary?'ذكرى زواجنا':'يوم زواجنا',label=days===0?'اليوم هو يومكما الجميل':days>0?'باقي '+num(days)+' يومًا':'مضى '+num(-days)+' يومًا على موعدكما';return `<section class="${compact?'notice':'card weddingBanner'}"><div class="cardhead"><div><small>موعد واحد يجمعكما</small><h2>${title} · ${label}</h2></div>${compact?'':btn('تعديل الموعد','family-wedding')}</div><p>${esc(weddingMessage(event))}</p><small>${fmt(target,true)}${anniversary?' · تاريخ الزواج '+fmt(event.date,true):''}</small></section>`}
function sharedCalendarPanel(){if(!F.familyId)return '';const first=familyCalendarMonth+'-01',date=parseDate(first),year=date.getFullYear(),month=date.getMonth(),offset=date.getDay(),length=new Date(year,month+1,0).getDate(),cells=[];for(let n=0;n<offset;n++)cells.push('<span aria-hidden="true"></span>');for(let day=1;day<=length;day++){const current=localDate(new Date(year,month,day,12)),events=F.events.filter(e=>occursShared(e,current)),wedding=events.some(e=>e.kind==='wedding');cells.push(`<button type="button" class="sharedCalDay ${current===today()?'today':''} ${wedding?'weddingDay':''}" data-act="family-calendar-day" data-date="${current}" aria-label="${esc(fmt(current,true))}، ${num(events.length)} مواعيد"><b>${num(day)}</b><small>${wedding?'♥':events.length?num(events.length)+' موعد':'·'}</small></button>`)}return `<section class="card sharedCalendar" id="sharedCalendar"><div class="cardhead"><div><h2>تقويمنا</h2><small>المواعيد هنا مشتركة بينكما وقابلة للتعديل من الطرفين.</small></div><div class="actions">${btn('موعد جديد','family-event-edit','',true)}${btn(weddingEvent()?'يوم زواجنا':'تحديد يوم زواجنا','family-wedding')}</div></div><div class="calendarNav"><button type="button" class="btn small" data-act="family-calendar-prev">الشهر السابق</button><b>${new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'}).format(date)}</b><div class="actions">${btn('اليوم','family-calendar-today')}${btn('الشهر التالي','family-calendar-next')}</div></div><div class="sharedCalGrid">${days.map(d=>`<small class="calWeekday">${d}</small>`).join('')}${cells.join('')}</div>${sharedUpcoming()}<div class="notice">تذكير الموعد يعمل داخل التطبيق. زر «تقويم الجهاز» يضيف الموعد والتنبيه إلى تقويمك كبديل عند إغلاق التطبيق. تنبيهات إنشاء الموعد وتعديله ترسل للشريك عبر خدمة Push إذا فعّلها.</div></section>`}
function sharedUpcoming(){const rows=F.events.map(e=>({event:e,date:nextSharedDate(e)})).filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)||(a.event.time||'').localeCompare(b.event.time||'')).slice(0,5);return `<h3 style="margin-top:18px">مواعيدكما القادمة</h3>${rows.length?rows.map(({event,date})=>sharedEventCard(event,date)).join(''):'<p class="muted">لا توجد مواعيد قادمة؛ أضيفا موعدًا أو يوم زواجكما.</p>'}`}
function sharedEventCard(event,date=nextSharedDate(event)){return `<article class="row"><div class="body"><b>${esc(event.title)}</b><p>${fmt(date,true)}${event.time?' · '+esc(event.time):''}${event.annual?' · يتكرر سنويًا':''}</p>${event.description?`<p>${esc(event.description)}</p>`:''}<small>تذكير داخل التطبيق ${event.reminder_days?'قبل '+num(event.reminder_days)+' يومًا':'في نفس اليوم'}</small></div><div class="actions">${btn('تعديل','family-event-edit',event.id)}${btn('تقويم الجهاز','family-event-ics',event.id)}${btn('حذف','family-event-delete',event.id)}</div></article>`}
function sharedCalendarDay(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;const events=F.events.filter(e=>occursShared(e,date));openModal('تقويمنا · '+fmt(date,true),`<div>${events.length?events.map(e=>sharedEventCard(e,date)).join(''):'<p class="muted">لا يوجد موعد في هذا اليوم.</p>'}<button type="button" class="btn primary" data-act="family-event-on-day" data-date="${date}">إضافة موعد لهذا اليوم</button></div>`)}
function familyEditEvent(id,wedding=false,date=today()){if(!F.familyId){go('family');toast('اربط المساحة أولًا لإضافة موعد مشترك.');return}let event=id?F.events.find(e=>e.id===id):wedding?weddingEvent():null;event=event||{id:null,title:wedding?'يوم زواجنا':'',description:'',date,time:'',annual:!!wedding,kind:wedding?'wedding':'event',reminder_days:1,revision:0};const kind=event.kind;openModal(kind==='wedding'?'يوم زواجنا · تاريخ واحد لكما':event.id?'تعديل موعد مشترك':'موعد في تقويمنا',field('title','الموعد',event.title,'text',{required:true,full:true})+field('date','التاريخ الميلادي',event.date,'date',{required:true})+field('time','الوقت بحسب جهازك (اختياري)',event.time||'','time')+field('description','ملاحظة مشتركة',event.description,'textarea',{full:true})+field('reminder','التذكير داخل التطبيق',event.reminder_days,'select',{options:[[0,'في نفس اليوم'],[1,'قبل يوم'],[3,'قبل 3 أيام'],[7,'قبل أسبوع'],[14,'قبل أسبوعين'],[30,'قبل شهر تقريبًا']],full:true})+`<label class="togglelabel full"><input type="checkbox" name="annual" ${event.annual?'checked':''}>${kind==='wedding'?'تكرار ذكرى الزواج سنويًا بعد الموعد الأول':'التكرار سنويًا'}</label><div class="notice full">يرى الشريك هذا الموعد، ويستطيع تعديله. ${kind==='wedding'?'يوجد يوم زواج واحد للمساحة؛ تعديل التاريخ يحدثه للطرفين.':''}</div>`,async f=>{const result=await familyRPC('md_save_event',{p_id:event.id,p_expected:event.revision,p_data:{kind,title:required(f,'title','عنوان الموعد'),date:validDate(str(f,'date'),'الموعد'),time:str(f,'time'),description:str(f,'description'),annual:f.has('annual'),reminder_days:nval(f,'reminder')}});familyTryPush(result.notice_id);await familyRefresh(true);familyCalendarMonth=str(f,'date').slice(0,7);return true},'حفظ لكلا الحسابين');if(kind==='wedding')$('#f_title').readOnly=true}
function familyDeleteEvent(id){const event=F.events.find(e=>e.id===id);if(!event)return;openModal('حذف موعد مشترك',`<p class="full">سيُحذف «${esc(event.title)}» من تقويمكما معًا. إذا سبق تصديره لتقويم الجهاز، احذفه من هناك أيضًا.</p>`,async()=>{const result=await familyRPC('md_delete_event',{p_id:id,p_expected:event.revision});familyTryPush(result.notice_id);await familyRefresh(true);return true},'حذف من تقويمنا')}
function sharedICSEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\r?\n|\r/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function sharedICS(event){const d=event.date.replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Madar//Shared Calendar//AR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+event.id+'@madar-calendar','SEQUENCE:'+event.revision,'DTSTAMP:'+stamp];if(event.time){const start=d+'T'+event.time.replace(':','')+'00';lines.push('DTSTART:'+start,'DURATION:PT1H')}else lines.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(event.date,1).replace(/-/g,''));lines.push('SUMMARY:'+sharedICSEscape(event.title),'DESCRIPTION:'+sharedICSEscape(event.description));if(event.annual){const p=parseDate(event.date),month=p.getMonth()+1,day=p.getDate();lines.push(month===2&&day===29?'RRULE:FREQ=YEARLY;BYMONTH=2;BYMONTHDAY=28,29;BYSETPOS=-1':'RRULE:FREQ=YEARLY;BYMONTH='+month+';BYMONTHDAY='+day)}lines.push('BEGIN:VALARM','TRIGGER:'+(event.reminder_days?'-P'+event.reminder_days+'D':'-PT0M'),'ACTION:DISPLAY','DESCRIPTION:'+sharedICSEscape(event.title),'END:VALARM','END:VEVENT','END:VCALENDAR');return lines.map(line=>{const output=[];let part='',bytes=0;for(const c of line){const size=new TextEncoder().encode(c).length;if(bytes+size>73){output.push(part);part=' '+c;bytes=1+size}else{part+=c;bytes+=size}}output.push(part);return output.join('\r\n')}).join('\r\n')+'\r\n'}
function exportSharedEvent(id){const event=F.events.find(e=>e.id===id);if(event)download(sharedICS(event),'Madar-shared-'+event.id+'.ics','text/calendar;charset=utf-8')}
function sharedEventReminderCheck(){if(!F.familyId)return;F.meta.calendarSeen=F.meta.calendarSeen||{};let changed=false;for(const event of F.events){const target=nextSharedDate(event),left=diffDays(target,today()),key=event.id+'|'+event.revision+'|'+target+'|'+left;if(left<0||![0,event.reminder_days].includes(left)||F.meta.calendarSeen[key])continue;if(left===0&&event.time&&new Date().toTimeString().slice(0,5)<event.time)continue;F.meta.calendarSeen[key]=Date.now();changed=true;const message=(left?'باقي '+num(left)+' يومًا: ':'اليوم: ')+event.title;D.notices.unshift({id:uid(),title:'تقويمنا · '+message,date:new Date().toISOString(),read:false});toast(message);if(F.pushEnabled&&'Notification'in window&&Notification.permission==='granted')try{const n=new Notification('مدار · تقويمنا',{body:message,tag:'calendar-'+event.id});n.onclick=()=>{window.focus();go('family')}}catch{}}if(changed){const entries=Object.entries(F.meta.calendarSeen).sort((a,b)=>b[1]-a[1]).slice(0,1000);F.meta.calendarSeen=Object.fromEntries(entries);persistFamilyMeta();save()}}

async function familyAuthForm(){try{if(personalUnsaved||modalDirty)throw Error('احفظ عملك أو صدّر مسودته قبل الانتقال لتسجيل الدخول.');if(location.protocol!=='https:'||!crypto.subtle)throw Error('ارفع الملفات إلى GitHub Pages وافتح رابط HTTPS لتسجيل الدخول.');const bytes=crypto.getRandomValues(new Uint8Array(32)),verifier=familyBase64(bytes),state=familyBase64(crypto.getRandomValues(new Uint8Array(32))),challenge=familyBase64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)))),returnURL=location.href.split('#')[0].split('?')[0];sessionStorage.setItem('madar.connect.pkce',JSON.stringify({verifier,state,returnURL,name:D.settings.profileName||'',replaceToken:F.session?.access_token||'',joinConsent:!!F.pendingInvite&&!!F.invitePreview,joinCode:F.pendingInvite||''}));location.assign(MADAR_SERVICE+'/connect?'+new URLSearchParams({return_url:returnURL,challenge,state}).toString())}catch(e){toast(e.message,true)}}

function sharedFinancePayload(options={}){const out={currency:D.settings.currency,debts:[],expenses:[]},month=today().slice(0,7);for(const d of D.debts.filter(d=>(options.debts||[]).includes(d.id))){const row={id:d.id,name:d.name};if(options.balances){row.original=d.original+(d.cost||0);row.remaining=remaining(d);row.installment=d.installment||0}if(options.dates&&d.due)row.due=d.due;if(options.paid)row.paidThisMonth=round(D.payments.filter(p=>p.debtId===d.id&&p.date.startsWith(month)).reduce((s,p)=>s+p.amount,0));out.debts.push(row)}for(const e of D.expenses.filter(e=>(options.expenses||[]).includes(e.id)))out.expenses.push({id:e.id,name:e.name,amount:e.amount,recurring:!!e.recurring,...options.dates?{date:e.date}:{}});for(const k of ['budget','income','savings'])if(options[k])out[k]=D.settings[k]||0;return out}

function buildSharedSnapshot(scopes=F.meta.scopes||{},finance=F.meta.finance||{}){let w=weekly();const snapshot={day:today(),scopes:{tasks:!!scopes.tasks,progress:!!scopes.progress,books:!!scopes.books,habits:!!scopes.habits,goals:!!scopes.goals,details:!!scopes.details,finance:!!scopes.finance},tasks:scopes.tasks?D.tasks.filter(t=>!t.private).map(t=>({id:t.id,title:t.title,description:scopes.details?t.description:'',date:t.date,time:t.time,priority:t.priority,done:!!t.done,category:t.category||''})):[],stats:scopes.progress?{...w,tasks:D.tasks.filter(t=>t.done&&!t.private&&inWeek(localDate(new Date(t.doneAt)))).length}:{},books:scopes.books?D.books.map(b=>({title:b.title,current:b.current,total:b.total,status:b.status})):[],habits:scopes.habits?D.habits.filter(h=>scheduledHabit(h)).map(h=>({title:h.title,current:habitAmount(h),target:h.target,unit:h.unit})):[],goals:scopes.goals?D.personalGoals.map(g=>({title:g.title,current:g.current,target:g.target,unit:g.unit})):[]};if(scopes.finance)snapshot.finance=sharedFinancePayload(finance);return snapshot;}
async function familyPublish(payload,{explicit=false}={}){if(!F.familyId)throw Error('أنشئ مساحة مشتركة أولًا.');if(F.shareConflict&&!explicit)throw Error('توجد نسخة مشاركة أحدث من جهاز آخر.');let own=F.snapshots.find(s=>s.user_id===familyUID()),expected=explicit?(own?.version||0):(F.meta.version||0),epoch=F.epoch;let result=await familyRPC('md_publish_snapshot',{p_expected:expected,p_payload:payload});if(epoch!==F.epoch)return;F.meta.version=result.version;F.sharedVersion=result.version;F.shareConflict=false;F.lastFingerprint=JSON.stringify(payload);persistFamilyMeta();F.snapshots=F.snapshots.filter(s=>s.user_id!==familyUID());F.snapshots.push({user_id:familyUID(),payload,version:result.version,updated_at:result.updated_at});return result}
function familySharingForm(){if(!F.familyId){toast('أنشئ المساحة أو انضم بالدعوة أولًا.',true);return}const scopes=F.meta.scopes||{tasks:true,progress:true};openModal('خصوصيتي: ما أُظهره للشريك',`<label class="togglelabel full"><input type="checkbox" name="enabled" ${F.meta.approved?'checked':''}>تحديث مشاركتي تلقائيًا من هذا الجهاز</label>`+[['tasks','المهام غير المعلّمة شخصية'],['details','وصف المهام أيضًا'],['progress','ملخص الإنجاز الأسبوعي'],['books','الكتب وتقدمها'],['habits','عادات اليوم'],['goals','الأهداف الشخصية']].map(([k,l])=>`<label class="togglelabel full"><input type="checkbox" name="${k}" ${scopes[k]?'checked':''}>${l}</label>`).join('')+financeControls()+'<div class="notice full">المهام الشخصية والاقتباسات وإنجازات اليوم لا تُنشر. المالية لا يظهر منها إلا ما تحدده هنا صراحة. الشريك لا يعدّل نسختك الشخصية.</div>',async f=>{const selected=Object.fromEntries(['tasks','details','progress','books','habits','goals','finance'].map(k=>[k,f.has(k)])),finance=financeOptionsFromForm(f),enabled=f.has('enabled');await familyRefresh(true);await familyPublish(buildSharedSnapshot(enabled?selected:{},finance),{explicit:true});F.meta.approved=enabled;F.meta.scopes=selected;F.meta.finance=finance;persistFamilyMeta();return true},'حفظ ونشر اختياراتي')}
function scheduleFamilyPublish(){if(!F.session||!F.familyId||!F.meta.approved||F.shareConflict)return;clearTimeout(F.publishTimer);F.publishTimer=setTimeout(async()=>{if(F.publishing){F.again=true;return}const payload=buildSharedSnapshot();if(JSON.stringify(payload)===F.lastFingerprint)return;F.publishing=true;try{await familyPublish(payload);F.error=''}catch(e){F.error=familyError(e);if(/SHARE_CONFLICT/.test(e.message))F.shareConflict=true}finally{F.publishing=false;if(F.again){F.again=false;scheduleFamilyPublish()}if(currentPage==='family'&&!$('#modal').open)render()}},900)}

async function heartSave(kind,day,data,visibility,existing,finance=false,requestId=uid()){if(H.busy)throw Error('ما زلنا نحفظ طلبًا آخر. انتظر لحظة.');if(!F.familyId)throw Error('أنشئ مساحتكما أو انضم برابط الدعوة أولًا.');if(navigator.onLine===false)return heartQueue(kind,day,data,visibility,existing,finance,requestId);H.busy=true;try{let result;try{result=await familyRPC('md_heart_save',{p_kind:kind,p_day:day,p_data:data,p_visibility:visibility,p_id:existing?.id||null,p_expected:existing?.revision||0,p_share_finance:finance,p_request_id:requestId})}catch(err){if(/انتهت مهلة الاتصال/.test(err.message))return heartQueue(kind,day,data,visibility,existing,finance,requestId);throw err}heartUpsert(result.record);if(result.notice_id)familyTryPush(result.notice_id);familyRefresh(true).catch(()=>{});return true}finally{H.busy=false}}

('إظهار للشريك','heart-share',r.id):own&&r.visibility==='shared'?btn('إخفاء','heart-hide',r.id):''}${canEdit?btn('حذف','heart-delete',r.id):''}${r.kind==='reconcile'&&!own?btn('رد في وقت مناسب','heart-reply',r.id):''}</div></article>`}

async function heartImage(file){if(file.size>3500000||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('اختر صورة PNG أو JPEG أو WebP لا تتجاوز 3 ميغابايت.');const image=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('تعذّر قراءة الصورة.'))};img.src=url});const ratio=Math.min(1,720/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let encoded=canvas.toDataURL('image/jpeg',.7);if(encoded.length>160000)encoded=canvas.toDataURL('image/jpeg',.45);if(encoded.length>160000)throw Error('الصورة كبيرة حتى بعد الضغط؛ اختر صورة أصغر.');return encoded}

function heartPreferencesForm(){const p=H.preferences||{categories:{},quietStart:'',quietEnd:''},names={gratitude:'رسائل الامتنان',longing:'رسائل الاشتياق',reconcile:'رسائل الصلح',dream:'الأحلام المحققة',mood:'المشاعر المشتركة',answer:'الإجابات',challenge:'التحديات',occasion:'المناسبات',daily:'سؤال الحب وتحدي اليوم أثناء فتح التطبيق'};openModal('تنبيهاتنا ووضع الهدوء',`<div class="notice full">اختر تنبيهات حسابك وحده. يظهر الوارد في المساحة حتى عند إيقاف إشعار الجهاز.</div>${Object.entries(names).map(([key,label])=>`<label class="togglelabel full"><input type="checkbox" name="${key}" ${p.categories?.[key]?'checked':''}>${label}</label>`).join('')}${field('quietStart','بدء الهدوء (اختياري)',p.quietStart||'','time')}${field('quietEnd','نهاية الهدوء (اختياري)',p.quietEnd||'','time')}<small class="full">تُحوّل الساعات إلى توقيت جهازك عند الحفظ. تفصل ساعات الهدوء إشعار الجهاز وتبقى الرسالة في الوارد.</small>`,async f=>{if(!F.familyId)throw Error('اربط الحساب أولًا.');if(Boolean(f.get('quietStart'))!==Boolean(f.get('quietEnd')))throw Error('حدد ساعة بداية ونهاية لوضع الهدوء، أو اتركهما فارغتين.');const categories=Object.fromEntries(Object.keys(names).map(k=>[k,f.has(k)])),result=await familyRPC('md_heart_preferences',{p_data:{categories,quietStart:String(f.get('quietStart')||''),quietEnd:String(f.get('quietEnd')||''),tzOffset:-new Date().getTimezoneOffset()}});H.preferences=result;return true},'حفظ اختياراتي')}

function zipCRC(bytes){let crc=-1;for(const b of bytes){crc^=b;for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^-1)>>>0}

function zipU32(view,offset,n){view.setUint32(offset,n>>>0,true)}
function zipFile(files){const encoder=new TextEncoder(),parts=[],directory=[];let offset=0;
 for(const[file,value]of files){const filename=encoder.encode(file),data=typeof value==='string'?encoder.encode(value):value,crc=zipCRC(data),local=new Uint8Array(30+filename.length),head=new DataView(local.buffer);zipU32(head,0,0x04034b50);zipU16(head,4,20);zipU16(head,6,0x0800);zipU16(head,8,0);zipU32(head,14,crc);zipU32(head,18,data.length);zipU32(head,22,data.length);zipU16(head,26,filename.length);local.set(filename,30);parts.push(local,data);const central=new Uint8Array(46+filename.length),c=new DataView(central.buffer);zipU32(c,0,0x02014b50);zipU16(c,4,20);zipU16(c,6,20);zipU16(c,8,0x0800);zipU32(c,16,crc);zipU32(c,20,data.length);zipU32(c,24,data.length);zipU16(c,28,filename.length);zipU32(c,42,offset);central.set(filename,46);directory.push(central);offset+=local.length+data.length}
 const end=new Uint8Array(22),tail=new DataView(end.buffer);zipU32(tail,0,0x06054b50);zipU16(tail,8,directory.length);zipU16(tail,10,directory.length);zipU32(tail,12,directory.reduce((s,b)=>s+b.length,0));zipU32(tail,16,offset);return new Blob([...parts,...directory,end],{type:'application/zip'})}

function runtimeBlob(){const entries=[['index.html',APP_STATIC_HTML],['Madar.html',APP_STATIC_HTML],...Object.entries(RUNTIME_ASSETS).map(([name,encoded])=>[name,runtimeBytes(encoded)])];return zipFile(entries)}

// User-chosen planning tools. Stored in existing per-person settings/records.
const taskEnergyLabels={light:'هادئة',medium:'متوسطة',heavy:'عالية'};
function dailyTaskPool(day=today()){return D.tasks.filter(t=>!t.done&&t.date<=day)}
function focusState(){return D.settings.focus||null}
function focusMs(f=focusState()){return f?Math.max(0,(f.elapsed||0)+(f.running?Date.now()-f.startedAt:0)):0}
function taskLoadPanel(){const open=D.tasks.filter(t=>!t.done&&t.date===today()),minutes=open.reduce((n,t)=>n+(t.estimate||0),0),heavy=open.filter(t=>t.effort==='heavy'),limit=D.settings.capacityMinutes||0,candidate=open.filter(t=>t.role!=='main').sort((a,b)=>(b.estimate||0)-(a.estimate||0))[0];return `<div class="notice ${limit&&minutes>limit?'warn':''}">حمولة اليوم: ${num(open.length)} مهام، ${num(minutes)} دقيقة مقدّرة، ${num(heavy.length)} ثقيلة. ${limit?`حدك الذي اخترته: ${num(limit)} دقيقة. ${minutes>limit?'الوقت المقدّر يتجاوز ما خصصته؛ يمكنك مراجعة مهمة وتأجيلها بنفسك.':'الوقت المقدّر ضمن حدك.'}`:'إذا أردت، حدد وقتًا متاحًا في إعدادات الطاقة.'}${candidate?btn('راجع تخفيف اليوم','load-suggest',candidate.id):''}</div>`}
function taskGroupSuggestions(){const groups=new Map();for(const t of D.tasks.filter(x=>!x.done&&x.category)){groups.set(t.category,(groups.get(t.category)||0)+1)}const suggestions=[...groups].filter(([,count])=>count>=2).sort((a,b)=>b[1]-a[1]).slice(0,3);return suggestions.length?`<div class="notice">مهام من التصنيف نفسه: ${suggestions.map(([category,count])=>`<button class="btn small" type="button" data-act="group-suggest" data-id="${esc(category)}">${esc(category)} · ${num(count)} — اعرضها معًا</button>`).join('')}</div>`:''}
function planningPanel(){
 const pool=dailyTaskPool(),energy=D.settings.energy||'medium',suitable=pool.filter(t=>energy==='heavy'||energy==='medium'?t.effort!=='heavy'||energy==='heavy':t.effort==='light'||!t.effort),count=Number.isInteger(D.settings.topCount)?D.settings.topCount:5;
 const sorted=[...suitable].sort((a,b)=>(b.role==='main')-(a.role==='main')||b.priority-a.priority||a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'ar'));
 const picked=count===0?sorted:sorted.slice(0,Math.max(0,count));
 const tomorrow=D.tasks.filter(t=>!t.done&&t.date===addDays(today(),1));
 const f=focusState(),focused=f&&D.tasks.find(t=>t.id===f.taskId);
 return `<section class="card plannerCard"><div class="cardhead"><div><h2>مهامي حسب طاقتي</h2><small>أنت تختار عدد المهام، وحتى عرضها كلها. الاقتراح لا يغيّر مواعيدك.</small></div>${btn('إعداد العدد والطاقة','planning-options')}</div><div class="actions"><span class="pill green">طاقتي اليوم: ${taskEnergyLabels[energy]}</span><span class="pill">${count?num(count)+' معروضة كحد أقصى':'جميع المهام المناسبة'}</span>${btn('أنقذ يومي','day-rescue')}${btn('مراجعة المساء','day-review')}</div>${picked.length?picked.map(t=>`<div class="plannerItem"><b>${esc(t.title)}</b><small>${fmt(t.date,true)} · ${t.effort?({light:'خفيفة',medium:'متوسطة',heavy:'ثقيلة'}[t.effort]):'ثقل غير محدد'}${t.estimate?' · '+num(t.estimate)+' دقيقة':''}</small>${btn('تركيز','focus-open',t.id)}${btn('أنجزتها','task-toggle',t.id)}</div>`).join(''):'<p class="muted">لا توجد مهام تناسب طاقتك المختارة الآن. يمكنك تغيير الطاقة أو إضافة مهمة خفيفة.</p>'}<div class="notice">بكرة: ${num(tomorrow.length)} مهام. ${tomorrow.slice(0,3).map(t=>esc(t.title)).join(' · ')||'خطط لخطوة صغيرة وقتما يناسبك.'}</div>${taskLoadPanel()}${taskGroupSuggestions()}${f?`<div class="focusStatus"><b>تركيز على ${esc(focused?.title||'مهمة حُذفت')}</b><strong id="focusClock">${clock(focusMs())}</strong>${btn(f.running?'إيقاف مؤقت':'استئناف','focus-toggle')}${btn('إنهاء التركيز','focus-end')}</div>`:''}</section>`;
}
function planningOptions(){openModal('اضبط يومك',field('topCount','كم مهمة تظهر في أولويات اليوم؟ (0 = كلها)',D.settings.topCount??5,'number',{required:true,min:0,step:1,full:true})+field('capacityMinutes','الوقت الذي أريده لمهام اليوم بالدقائق (0 = بلا حد)',D.settings.capacityMinutes||0,'number',{min:0,step:1,full:true})+field('energy','طاقتي المتاحة',D.settings.energy||'medium','select',{full:true,options:[['light','هادئة · المهام الخفيفة'],['medium','متوسطة · خفيفة ومتوسطة'],['heavy','عالية · جميع المهام']]}),f=>{const n=integer(nval(f,'topCount'),'عدد المهام',true);if(n>50000)throw Error('العدد أكبر من سعة المهام الحالية.');D.settings.topCount=n;D.settings.capacityMinutes=integer(nval(f,'capacityMinutes'),'الوقت المتاح',true);D.settings.energy=str(f,'energy');return true})}

function lifeEdit(id){const x=D.lifePlans.find(v=>v.id===id)||{type:'maintenance',title:'',starts:today(),due:'',frequency:'none',remind:3,steps:[],note:'',history:[]};openModal(id?'تعديل الترتيب':'ترتيب جديد',field('type','النوع',x.type,'select',{options:Object.entries(LIFE_TYPES)})+field('title','العنوان',x.title,'text',{required:true,full:true})+field('starts','بداية الفترة (للأهداف أو العقد)',x.starts||today(),'date')+field('due','الموعد أو نهاية الفترة (اختياري)',x.due,'date')+field('frequency','تكرار الصيانة بعد الإنجاز',x.frequency||'none','select',{options:[['none','لا يتكرر'],['monthly','كل شهر'],['yearly','كل سنة']]})+field('remind','تنبيه عند فتح التطبيق قبل الموعد',x.remind??3,'select',{options:[[0,'نفس اليوم'],[1,'يوم'],[3,'٣ أيام'],[7,'أسبوع'],[-1,'دون تنبيه']]})+field('steps','خطوات أو قائمة تجهيز (كل سطر خطوة)',(x.steps||[]).map(s=>(s.done?'✓ ':'')+s.title).join('\n'),'textarea',{full:true})+field('note','ملاحظة أو رقم عقد (اختياري)',x.note||'','textarea',{full:true}),f=>{let starts=validDate(str(f,'starts'),'البداية',true),due=validDate(str(f,'due'),'الموعد',true),type=str(f,'type');if(due&&starts&&due<starts)throw Error('النهاية قبل بداية الفترة.');let steps=str(f,'steps').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(steps.length>100)throw Error('الحد ١٠٠ خطوة.');let item={...x,id:id||uid(),title:required(f,'title','العنوان'),type,starts,due,frequency:str(f,'frequency'),remind:nval(f,'remind'),steps:steps.map(s=>({title:s.replace(/^✓\s*/,''),done:s.startsWith('✓')})),note:str(f,'note'),notifiedKey:''};if(!LIFE_TYPES[type])throw Error('اختر نوع الترتيب.');if(id)D.lifePlans[D.lifePlans.indexOf(x)]=item;else D.lifePlans.push(item);return true})}
function lifeComplete(id){let x=D.lifePlans.find(v=>v.id===id);if(!x)return;openModal('تأكيد الإنجاز · '+x.title,`<p class="full">سنسجل الإنجاز بتاريخ اليوم. ${x.frequency!=='none'&&x.type==='maintenance'?'موعد الصيانة التالي يُحسب بعد تأكيدك.':''}</p>`,()=>{x.history=(x.history||[]).slice(-199);x.history.push({at:new Date().toISOString(),due:x.due||''});if(x.type==='maintenance'&&x.frequency!=='none'){x.due=addMonths(x.due&&x.due>today()?x.due:today(),x.frequency==='yearly'?12:1);x.completedAt=null;x.steps=(x.steps||[]).map(s=>({...s,done:false}));x.notifiedKey=''}else x.completedAt=new Date().toISOString();return true},'نعم، أنجزته')}

function lifeTick(){if(personalRecoveryBusy)return;let current=today(),changed=false;for(let x of D.lifePlans){if(x.completedAt||!x.due||x.remind<0)continue;let date=addDays(x.due,-x.remind),key=x.id+'|'+x.due;if(current>=date&&x.notifiedKey!==key){x.notifiedKey=key;D.notices.unshift({id:uid(),title:'موعد '+x.title+' · '+fmt(x.due,true),date:new Date().toISOString(),read:false});changed=true}}if(changed){save();render()}}
function validateLifePlans(v){if(v.lifePlans===undefined)return;if(!Array.isArray(v.lifePlans)||v.lifePlans.length>50000)throw Error('ترتيبات غير صالحة.');for(let x of v.lifePlans)if(!x||!LIFE_TYPES[x.type]||typeof x.title!=='string'||!x.title||x.title.length>500||x.due&&!/^\d{4}-\d{2}-\d{2}$/.test(x.due)||!Array.isArray(x.steps)||x.steps.length>100||x.steps.some(s=>!s||typeof s.title!=='string'||typeof s.done!=='boolean'))throw Error('ترتيب غير صالح.')}

function validateDailyGrowth(v){for(const [key,limit] of [['englishWords',50000],['careDays',20000],['careItems',1000],['incomes',50000]])if(v[key]!==undefined&&(!Array.isArray(v[key])||v[key].length>limit))throw Error('قائمة '+key+' غير صالحة.');let settings=v.settings||{};for(const goal of ['englishWeek','englishMonth'])if(settings[goal]!==undefined&&(!Number.isInteger(settings[goal])||settings[goal]<0||settings[goal]>10000))throw Error('هدف الكلمات غير صالح.');if(settings.visibleNav!==undefined&&(!Array.isArray(settings.visibleNav)||settings.visibleNav.some(x=>!['home','tasks','work','money','workout','book','english','care','quit','faith','calm','journal','life','heart','family','reports','growth'].includes(x))||new Set(settings.visibleNav).size!==settings.visibleNav.length))throw Error('اختيارات القائمة غير صالحة.');for(const x of v.englishWords||[])if(!x||typeof x.id!=='string'||typeof x.word!=='string'||!x.word.trim()||x.word.length>120||typeof x.meaning!=='string'||x.meaning.length>500||typeof x.addedAt!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.addedAt)||x.learnedAt!==undefined&&x.learnedAt!==''&&!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.learnedAt)||x.example!==undefined&&(typeof x.example!=='string'||x.example.length>1000)||x.reviewedAt!==undefined&&(typeof x.reviewedAt!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.reviewedAt)))throw Error('سجل كلمة إنجليزية غير صالح.');for(const x of v.careItems||[])if(!x||typeof x.id!=='string'||typeof x.label!=='string'||!x.label.trim()||x.label.length>100||!Number.isInteger(x.times)||x.times<1||x.times>2)throw Error('روتين العناية غير صالح.');const careDates=new Set();for(const x of v.careDays||[])if(!x||typeof x.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||typeof x.checks!=='object'||Array.isArray(x.checks)||x.checks===null||Object.values(x.checks).some(y=>typeof y!=='boolean')||!Array.isArray(x.photos)||x.photos.length>2||new Set(x.photos.map(p=>p.kind)).size!==x.photos.length||x.photos.some(p=>!p||!['body','skin'].includes(p.kind)||typeof p.image!=='string'||p.image.length>75000||!/^data:image\/jpeg;base64,/.test(p.image)))throw Error('سجل العناية أو صوره غير صالح.');for(const x of v.careDays||[]){if(careDates.has(x.date))throw Error('يوم عناية مكرر.');careDates.add(x.date)}for(const x of v.incomes||[])if(!x||typeof x.id!=='string'||typeof x.name!=='string'||!x.name.trim()||x.name.length>200||typeof x.amount!=='number'||!Number.isFinite(x.amount)||x.amount<=0||x.amount>1e12||!/^\d{4}-\d{2}-\d{2}$/.test(x.date))throw Error('مدخول مالي غير صالح.');}

function validateQuitData(v){for(const key of ['quitHabits','quitRelapses'])if(v[key]!==undefined&&(!Array.isArray(v[key])||v[key].length>50000))throw Error('سجل العادات غير صالح.');for(const h of v.quitHabits||[])if(!h||typeof h.id!=='string'||typeof h.title!=='string'||!h.title.trim()||h.title.length>140||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(h.startDate)||!Number.isFinite(parseDate(h.startDate).getTime())||localDate(parseDate(h.startDate))!==h.startDate||h.note!==undefined&&(typeof h.note!=='string'||h.note.length>2000))throw Error('عادة أو تاريخ بداية غير صالح.');const habitIds=new Set((v.quitHabits||[]).map(h=>h.id));for(const r of v.quitRelapses||[])if(!r||typeof r.id!=='string'||typeof r.habitId!=='string'||!habitIds.has(r.habitId)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(r.date)||!Number.isFinite(parseDate(r.date).getTime())||localDate(parseDate(r.date))!==r.date||r.date<(v.quitHabits||[]).find(h=>h.id===r.habitId).startDate||r.note!==undefined&&(typeof r.note!=='string'||r.note.length>1000))throw Error('سجل الرجوع للعادة غير صالح.');let seen=new Set();for(const r of v.quitRelapses||[]){let k=r.habitId+'|'+r.date;if(seen.has(k))throw Error('تسجيل متكرر للعادة في اليوم نفسه.');seen.add(k)}}
function quitEvents(id){return D.quitRelapses.filter(r=>r.habitId===id).sort((a,b)=>a.date.localeCompare(b.date))}
function quitStats(h,date=today()){let records=quitEvents(h.id).filter(r=>r.date<=date),last=records.at(-1)?.date||h.startDate,longest=0,from=h.startDate;for(const r of records){longest=Math.max(longest,diffDays(r.date,from));from=r.date}longest=Math.max(longest,diffDays(date,from));return {streak:Math.max(0,diffDays(date,last)),longest,last:records.at(-1)?.date||'',relapses:records.length}}
function quitMonthStats(h,month){let first=month+'-01',monthEnd=localDate(new Date(Number(month.slice(0,4)),Number(month.slice(5)),0,12));if(monthEnd<h.startDate||first>today())return null;let begin=first<h.startDate?h.startDate:first,end=monthEnd>today()?today():monthEnd,count=quitEvents(h.id).filter(r=>r.date>=begin&&r.date<=end).length,elapsed=diffDays(end,begin)+1;return {days:elapsed,relapses:count,clean:elapsed-count}}
let quitMonth=today().slice(0,7);
function quitVerse(){return QUIT_VERSES[(Number(today().slice(5,7))-1)%QUIT_VERSES.length]}
function quitPhrase(h){let s=quitStats(h),current=quitMonthStats(h,today().slice(0,7)),last=quitMonthStats(h,addMonths(today(),-1).slice(0,7));if(current&&last&&current.relapses/current.days<last.relapses/last.days)return QUIT_WORDS[6];return QUIT_WORDS[(parseDate(today()).getDate()+h.title.length)%QUIT_WORDS.length]}
function quitPage(){let any=D.quitHabits.length;return head('🌱 أترك عادة','كل يوم تحسبه لنفسك. التسجيل للمساعدة، بلا مقارنة ولا لوم.',btn('أضف عادة أريد تركها','quit-edit','',true,'plus'))+`<section class="card quitIntro"><h2>ابدأ من يوم تختاره</h2><p>إذا رجعت للعادة، سجّل اليوم بضغطة؛ يعود عدادك للصفر وتبقى أيامك السابقة وأطول فترة محفوظة. تقدر تعدّل أو تحذف تسجيلًا أدخلته بالخطأ.</p></section>${any?D.quitHabits.map(h=>quitCard(h)).join(''):'<section class="card"><h2>خطوتك الأولى 🌿</h2><p class="muted">سمّ عادة ترغب في تركها وحدد تاريخ البداية. ما بنضيف أي عادة نيابة عنك.</p>'+btn('أضف أول عادة','quit-edit','',true)+'</section>'}`}
function quitCard(h){let s=quitStats(h),m=quitMonthStats(h,quitMonth),previous=quitMonthStats(h,addMonths(quitMonth+'-01',-1).slice(0,7)),last=quitEvents(h.id).slice().reverse();return `<section class="card quitCard"><div class="cardhead"><div><h2>🌿 ${esc(h.title)}</h2><small>بدأت في ${fmt(h.startDate,true)}</small></div><div class="actions">${btn('تعديل','quit-edit',h.id)}${btn('حذف','quit-delete',h.id)}</div></div>${h.note?`<p>${esc(h.note)}</p>`:''}<div class="stats">${stat('من آخر رجوع',num(s.streak)+' يوم','يحسب الأيام الكاملة منذ آخر تسجيل','clock')}${stat('أطول فترة',num(s.longest)+' يوم','الرجوع لا يمحو تقدمك السابق','check')}${stat('آخر مرة',s.last?fmt(s.last,true):'لم تسجل رجوعًا','', 'calendar')}</div><blockquote class="quitVerse">${quitVerse()[0]} <small><a href="${quitVerse()[2]}" target="_blank" rel="noopener noreferrer">${quitVerse()[1]}</a></small></blockquote><p class="quitPhrase">${esc(quitPhrase(h))}</p><div class="actions">${btn('سجّل رجوعًا للعادة','quit-relapse',''+h.id)}${s.last?btn('راجع آخر تسجيل','quit-relapse-edit',last[0].id):''}</div><details class="details" open><summary>📊 ملخص شهر ${esc(quitMonth)}</summary><label class="field"><span>اختر شهرًا للتقرير</span><input type="month" class="quitMonth" value="${quitMonth}" max="${today().slice(0,7)}"></label>${m?`<div class="minirow"><span>أيام بلا تسجيل رجوع</span><b>${num(m.clean)} من ${num(m.days)}</b></div><div class="minirow"><span>أيام سجّلت فيها رجوعًا</span><b>${num(m.relapses)}</b></div>${previous?`<div class="minirow"><span>الشهر السابق</span><b>${num(previous.clean)} من ${num(previous.days)} يوم بلا تسجيل</b></div><p class="muted">${m.relapses/m.days<previous.relapses/previous.days?'تقدم لطيف: نسبة أيام الرجوع أقل من الشهر السابق.':m.relapses/m.days===previous.relapses/previous.days?'التسجيل مستقر مقارنة بالشهر السابق.':'إذا كان هذا الشهر أصعب، يمكنك بدء يوم جديد بهدوء.'}</p>`:''}<small>تعتمد الأرقام على ما تسجله أنت، من تاريخ بداية العادة حتى اليوم. اليوم الذي وقع فيه رجوع يُحسب مرة واحدة.</small>`:'<p class="muted">هذا الشهر قبل بداية تسجيل هذه العادة.</p>'}</details><details class="details"><summary>سجل الأيام (${num(last.length)})</summary>${last.length?limitedRows(last,'quit|'+h.id,r=>`<div class="financeExtraRow"><span>${fmt(r.date,true)}${r.note?' · '+esc(r.note):''}</span><div class="actions">${btn('تعديل','quit-relapse-edit',r.id)}${btn('حذف التسجيل','quit-relapse-delete',r.id)}</div></div>`):'<p class="muted">ما سجلت رجوعًا. واصل على راحتك.</p>'}</details></section>`}
function quitEdit(id){let h=D.quitHabits.find(x=>x.id===id)||{title:'',startDate:today(),note:''};openModal(id?'تعديل العادة':'عادة أريد تركها',field('title','اسم العادة',h.title,'text',{required:true,full:true})+field('startDate','من أي يوم بدأ العد؟',h.startDate,'date',{required:true,max:today()})+field('note','لماذا تهمك؟ (اختياري)',h.note||'','textarea',{full:true}),f=>{let title=required(f,'title','العادة'),startDate=validDate(str(f,'startDate'),'البداية'),note=str(f,'note').trim();if(title.length>140||note.length>2000||startDate>today())throw Error('راجع الاسم أو تاريخ البداية.');if(id&&D.quitRelapses.some(r=>r.habitId===id&&r.date<startDate))throw Error('تاريخ البداية الجديد بعد تسجيل سابق؛ عدّل التسجيل أولًا.');let next={...h,id:id||uid(),title,startDate,note};if(id)D.quitHabits[D.quitHabits.indexOf(h)]=next;else D.quitHabits.push(next);return true})}
function quitRelapse(id,habitId){let r=D.quitRelapses.find(x=>x.id===id),h=D.quitHabits.find(x=>x.id===(r?.habitId||habitId));if(!h)return;openModal(r?'تعديل تسجيل الرجوع':'تسجيل رجوع · '+h.title,field('date','اليوم الذي حدث فيه',r?.date||today(),'date',{required:true,min:h.startDate,max:today()})+field('note','ملاحظة تساعدني أفهم السبب (اختياري)',r?.note||'','textarea',{full:true})+'<p class="muted full">لا يمحو التسجيل تقدمك السابق. تستطيع التراجع عن تسجيلٍ بالخطأ.</p>',f=>{let date=validDate(str(f,'date'),'التسجيل'),note=str(f,'note').trim();if(date<h.startDate||date>today()||note.length>1000)throw Error('راجع التاريخ أو الملاحظة.');if(D.quitRelapses.some(x=>x.id!==id&&x.habitId===h.id&&x.date===date))throw Error('هذا اليوم مسجل بالفعل؛ عدّله بدل تكراره.');let next={id:id||uid(),habitId:h.id,date,note};if(r)D.quitRelapses[D.quitRelapses.indexOf(r)]=next;else D.quitRelapses.push(next);return true})}

document.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let id=b.dataset.id;switch(b.dataset.act){case'quit-open':go('quit');break;case'quit-edit':quitEdit(id);break;case'quit-relapse':quitRelapse(null,id);break;case'quit-relapse-edit':quitRelapse(id);break;case'quit-relapse-delete':case'quit-delete':{let isHabit=b.dataset.act==='quit-delete';openModal('تأكيد الحذف',`<p class="full">${isHabit?'ستُنقل العادة وتسجيلات رجوعها إلى سلة المحذوفات.':'ستُنقل هذه المرة إلى سلة المحذوفات، ويُعاد حساب الفترات.'}</p>`,()=>{let before=clone(D);if(isHabit){D.quitHabits=D.quitHabits.filter(x=>x.id!==id);D.quitRelapses=D.quitRelapses.filter(x=>x.habitId!==id)}else D.quitRelapses=D.quitRelapses.filter(x=>x.id!==id);rememberDeletion(before,isHabit?'quitHabits':'quitRelapses');return true},'نقل إلى السلة');break}}});
