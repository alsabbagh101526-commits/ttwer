let recoveryRaw='',D=defaults(),currentPage='home',taskFilter='today',bookFilter='all',workFilter='all',searchText='',storageOK=true,pendingImport=null,modalSubmit=null,taskPriority='all',taskCategory='all',taskOrder='date',agendaOffset=0,modalDirty=false,pendingExternal=null,lastStoredRaw=null,quoteOffset=0;

افة','expense-edit','',false,'plus')}</div>${D.expenses.length?D.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="row"><div class="body"><b>${esc(e.name)}</b><p>${money(e.amount)} · ${e.recurring?'كل شهر':fmt(e.date,true)}</p></div><div class="actions"><button class="btn small" data-act="expense-edit" data-id="${e.id}">تعديل</button><button class="btn small danger" data-act="expense-delete" data-id="${e.id}">حذف</button></div></div>`).join(''):'<p class="muted">أضف مصروفًا لتقدّر المبلغ المتاح للسداد.</p>'}</section></div></div>`}
function debtCard(d,p){let r=remaining(d),payments=D.payments.filter(v=>v.debtId===d.id).sort((a,b)=>b.date.localeCompare(a.date));return `<article class="item" data-debt="${d.id}"><div class="itemtop"><div><h3 class="itemtitle">${esc(d.name)}</h3><small>الاستحقاق: ${fmt(d.due,true)}</small></div><span class="pill ${!r?'green':d.due&&d.due<today()?'red':''}">${!r?'مسدد':d.due&&d.due<today()?'تجاوز الاستحقاق':'قيد السداد'}</span></div><div class="splitnum"><div><small>المتبقي</small><b>${money(r)}</b></div><div><small>المسدد</small><b>${money(paidTotal(d))}</b></div><div><small>الأصلي${d.cost?' + التكلفة':''}</small><b>${money(d.original+(d.cost||0))}</b></div><div><small>قسط مقترح</small><b>${money(d.installment||0)}</b></div></div>${progress(paidTotal(d)/(d.original+(d.cost||0))*100)}<div class="minirow"><small>تم سداد ${num(Math.round(paidTotal(d)/(d.original+(d.cost||0))*100))}%${d.openingPaid?' · يشمل '+money(d.openingPaid)+' مسددة قبل التسجيل':''}</small>${d.cost?`<small>التكلفة المدخلة: ${money(d.cost)}</small>`:''}</div><div class="itembottom"><div class="actions">${r?btn('دفعت مبلغًا','payment-new',d.id,true):''}${btn('تعديل','debt-edit',d.id)}<button class="btn danger" data-act="debt-delete" data-id="${d.id}">حذف</button></div></div><details class="details"><summary>سجل الدفعات (${num(payments.length)})</summary>${payments.length?payments.map(v=>`<div class="row"><div class="body"><b>${money(v.amount)}</b><p>${fmt(v.date,true)}${v.note?' · '+esc(v.note):''}</p></div><div class="actions"><button class="btn small" data-act="payment-edit" data-id="${v.id}">تعديل</button><button class="btn small danger" data-act="payment-delete" data-id="${v.id}">حذف</button></div></div>`).join(''):'<small>لم تسجل دفعات بعد.</small>'}</details></article>`}

function elapsed(t=D.timer){return t?Math.max(0,(t.elapsed||0)+(t.running?Date.now()-t.startedAt:0)):0}
function clock(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);return (h?String(h).padStart(2,'0')+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function restRemaining(){let t=D.timer;return t?Math.max(0,(t.restRemaining||0)-(t.restRunning?Date.now()-t.restStartedAt:0)):0}
function timerPanel(){let t=D.timer;if(!t)return `<div class="cardhead"><h2>جلسة اليوم</h2><span class="pill green">جاهز للحركة</span></div>${empty('clock','ابدأ مؤقتك','اختر تمرينًا من الخطة أو ابدأ جلسة حرة.','session-start','جلسة حرة')}`;return `<div class="cardhead"><h2>${esc(t.name)}</h2><span class="pill green">${t.running?'المؤقت يعمل':'متوقف مؤقتًا'}</span></div><div class="timer"><small>مدة الجلسة · تشمل الراحة</small><div class="clock" id="sessionClock">${clock(elapsed())}</div><div class="actions">${btn(t.running?'إيقاف مؤقت':'استئناف','timer-toggle')}${btn('إنهاء وتسجيل','session-finish','',true)}</div><small>يستمر الحساب عند تحديث الصفحة، ويحفظ الإيقاف المؤقت.</small></div><div class="minirow"><b>راحة بين المجموعات</b><span id="restClock">${clock(restRemaining())}</span></div><div class="actions"><button class="btn small" data-act="rest-start" data-id="30">30 ثانية</button><button class="btn small" data-act="rest-start" data-id="60">60 ثانية</button><button class="btn small" data-act="rest-start" data-id="90">90 ثانية</button>${btn(t.restRunning?'إيقاف الراحة':'استئناف الراحة','rest-toggle')}${btn('إلغاء الراحة','rest-clear')}${btn('وقت مخصص','rest-custom')}</div><div class="itembottom"><span class="pill">مجموعات منجزة: <b>${num(t.sets||0)}</b></span><div class="actions">${btn('+ مجموعة','set-plus')}${btn('− مجموعة','set-minus')}${btn('إلغاء الجلسة','timer-cancel')}</div></div>`}
function booksPage(){let books=D.books.filter(b=>bookFilter==='all'||b.status===bookFilter),reading=D.books.filter(b=>b.status==='reading').length;return head('رفّك الشخصي','احتفظ بآخر صفحة، وامنح القراءة وقتها.',btn('إضافة كتاب','book-edit','',true,'plus'))+`<div class="stats">${stat('أقرأ الآن',num(reading),'كتب قيد القراءة','book')}${stat('كتب مكتملة',num(D.books.filter(b=>b.status==='done').length),'صفحات صارت معرفة','check')}${stat('قرأت هذا الأسبوع',num(weekly().pages),'صفحات من الجلسات المسجلة','reports')}${stat('وقت القراءة',num(D.readings.reduce((s,r)=>s+r.minutes,0))+' د',num(D.readings.length)+' جلسات مسجلة','clock')}</div><div class="toolbar"><div class="tabs">${[['all','كل الكتب'],['reading','أقرأ الآن'],['done','مكتمل'],['paused','متوقف']].map(([k,l])=>`<button data-bookfilter="${k}" class="${bookFilter===k?'active':''}">${l}</button>`).join('')}</div></div><div class="grid2 equal">${books.length?books.map(bookCard).join(''):empty('book','صفحتك الأولى تنتظر','أضف عنوان الكتاب وعدد صفحاته لتبدأ.','book-edit','إضافة أول كتاب')}</div>`}
function bookCard(b){let logs=D.readings.filter(r=>r.bookId===b.id).sort((a,c)=>c.date.localeCompare(a.date));return `<article class="item" data-book="${b.id}"><div class="itemtop"><div style="display:flex;gap:13px;align-items:center"><div class="bookcover">${icon('book')}</div><div><h3>${esc(b.title)}</h3><small>${esc(b.author||'مؤلف غير محدد')}</small><div><span class="pill ${b.status==='done'?'green':''}">${{reading:'أقرأ الآن',done:'مكتمل',paused:'متوقف مؤقتًا'}[b.status]}</span></div></div></div><b style="color:var(--brand)">${num(Math.round(b.current/b.total*100))}%</b></div>${progress(b.current/b.total*100)}<div class="minirow"><span>صفحة ${num(b.current)} من ${num(b.total)}</span><small>${num(b.total-b.current)} صفحة متبقية</small></div><div class="minirow"><small>المتوسط لكل يوم قراءة: ${num(average(b))} صفحة</small><small>${num(logs.length)} جلسات</small></div>${b.target?`<div class="notice ${b.target<today()&&b.current<b.total?'warn':''}">${b.target<today()&&b.current<b.total?'تجاوزت الموعد المستهدف؛ يمكنك تعديله.':'الهدف: '+fmt(b.target,true)}${pageGoal(b)?'<br>نحو '+num(pageGoal(b))+' صفحة يوميًا للوصول إلى هدفك.':''}</div>`:''}<div class="actions">${b.current<b.total?btn('تسجيل قراءة','reading-new',b.id,true):''}${b.current<b.total?btn('+10 صفحات','reading-quick',b.id):''}${b.status!=='done'?btn(b.status==='paused'?'استئناف الكتاب':'إيقاف مؤقت','book-status',b.id):''}${btn('تحديث الصفحة','book-page',b.id)}${btn('تعديل','book-edit',b.id)}<button class="btn danger" data-act="book-delete" data-id="${b.id}">حذف</button></div><details class="details"><summary>جلسات القراءة والاقتباسات (${num(logs.length)})</summary>${logs.length?logs.map(r=>`<div class="row"><div class="body"><b>من ${num(r.from)} إلى ${num(r.to)}</b><p>${fmt(r.date,true)} · ${num(r.minutes)} دقيقة · ${num(r.to-r.from)} صفحات</p>${r.note?`<p>«${esc(r.note)}»</p>`:''}</div><div class="actions"><button class="btn small" data-act="reading-edit" data-id="${r.id}">تعديل</button><button class="btn small danger" data-act="reading-delete" data-id="${r.id}">حذف</button></div></div>`).join(''):'<small>لم تُسجّل جلسة بعد.</small>'}</details></article>`}
function goalRows(w){return [['tasks','مهام مكتملة','مهمة'],['sessions','جلسات التمرين','جلسة'],['minutes','وقت النشاط','دقيقة'],['pages','صفحات القراءة','صفحة']].map(([k,l,u])=>`<div class="goal"><div class="minirow"><span>${l}</span><small>${num(w[k])} / ${num(D.goals[k])} ${u}</small></div>${progress(D.goals[k]?w[k]/D.goals[k]*100:0)}</div>`).join('')}
function weekChart(key){let weeks=[3,2,1,0].map(n=>{let s=addDays(weekStart(),-7*n);return {s,v:weekly(s)[key],n}}),max=Math.max(1,...weeks.map(w=>w.v));return `<div class="chart" role="img" aria-label="${key==='minutes'?'دقائق التمرين':'صفحات القراءة'} لأربعة أسابيع: ${weeks.map(w=>fmt(w.s)+' '+num(w.v)).join('، ')}">${weeks.map(w=>`<div class="bar ${w.n===0?'current':''}" style="height:${Math.max(2,w.v/max*75)}px"><b>${num(w.v)}</b><span>${w.n===0?'هذا الأسبوع':fmt(w.s)}</span></div>`).join('')}</div>`}
function reports(){let w=weekly(),prev=weekly(addDays(weekStart(),-7)),late=D.tasks.filter(isLate),start=weekStart();return head('أسبوعك في سطور','من '+fmt(start)+' إلى '+fmt(addDays(start,6),true),`<div class="actions">${btn('طباعة التقرير','report-print')}${btn('تعديل الأهداف','goals-edit')}</div>`)+`<div class="grid2"><div class="stack"><section class="card"><h2>ما أنجزته</h2>${weeklyGrowthSummary()}<div class="reportnums"><div><b>${num(w.tasks)}</b><small>مهام مكتملة</small></div><div><b>${num(w.sessions)}</b><small>جلسات تمرين</small></div><div><b>${num(w.pages)}</b><small>صفحات مقروءة</small></div></div><div class="notice">${w.tasks||w.sessions||w.pages?'خطواتك هذا الأسبوع مسجلة. راجع الأهداف واضبطها حسب وقتك.':'ابدأ بإضافة مهمة أو جلسة؛ سيظهر تقريرك تلقائيًا هنا.'}</div><p class="muted">مقارنة بالأسبوع السابق: المهام ${num(w.tasks-prev.tasks>=0?w.tasks-prev.tasks:prev.tasks-w.tasks)} ${w.tasks>=prev.tasks?'أكثر':'أقل'}، والتمرين ${num(Math.abs(w.minutes-prev.minutes))} دقيقة ${w.minutes>=prev.minutes?'أكثر':'أقل'}، والقراءة ${num(Math.abs(w.pages-prev.pages))} صفحة ${w.pages>=prev.pages?'أكثر':'أقل'}.</p></section><section class="card"><h2>ما يحتاج المراجعة</h2>${late.length?sortedTasks(late).slice(0,8).map(t=>taskRow(t,true)).join(''):'<p class="muted">لا توجد مهام متأخرة حاليًا.</p>'}${late.length?btn('مراجعة المتأخر','show-overdue'):''}<div class="notice">أيام الراحة المخططة لا تظهر كمهمات فائتة. مقارنة الأسبوع الحالي بالسابق تشمل الأيام التي مرّت من هذا الأسبوع.</div></section><section class="card"><h2>تقدم القراءة</h2>${weekChart('pages')}</section></div><section class="card"><div class="cardhead"><h2>أهداف أسبوعية</h2>${btn('تعديل','goals-edit')}</div>${goalRows(w)}<small>الأسبوع يبدأ يوم الأحد. الأهداف تتجدد حسابيًا كل أسبوع، وتبقى سجلاتك محفوظة.</small></section></div>`}
function settings(){return head('إعدادات مساحتك','تحكّم في المظهر والنسخ الاحتياطي والتذكيرات.')+`<section class="card" style="margin-bottom:20px"><h2>اسمك وترحيبك</h2><p class="subtitle">${esc(D.settings.profileName||'لم يُحدد الاسم بعد')}</p>${btn('تعديل اسمي','profile-name')}</section>`+`<div class="settingsgrid"><section class="card"><h2>المظهر والعملة</h2><div class="formgrid" style="margin-top:20px"><label class="field full"><span>المظهر</span><select id="themeSelect"><option value="light" ${D.settings.theme==='light'?'selected':''}>فاتح</option><option value="dark" ${D.settings.theme==='dark'?'selected':''}>داكن</option></select></label><label class="field full"><span>عملة العرض</span><select id="currency">${[['SAR','ريال سعودي'],['KWD','دينار كويتي'],['AED','درهم إماراتي'],['USD','دولار أمريكي'],['EUR','يورو'],['JOD','دينار أردني'],['EGP','جنيه مصري'],['BHD','دينار بحريني'],['QAR','ريال قطري'],['OMR','ريال عُماني']].map(([k,l])=>`<option value="${k}" ${D.settings.currency===k?'selected':''}>${l} (${k})</option>`).join('')}</select><small>تغيير الرمز فقط؛ لا يتم تحويل المبالغ بسعر صرف.</small></label></div></section><section class="card"><h2>التذكيرات والإشعارات</h2><p class="subtitle">التنبيهات داخل التطبيق تعمل أثناء فتحه. إشعارات الجهاز اختيارية.</p><div class="notice warn">تذكيرات المهام ومواعيد التقويم تعمل أثناء فتح التطبيق؛ أضف الموعد إلى تقويم جهازك للتنبيه عند إغلاقه. تنبيهات الشريك الفورية تستخدم Web Push عند تفعيلها، وتظل خاضعة لإعدادات النظام والاتصال.</div><div class="actions" style="margin-top:15px">${btn(D.settings.notifications?'إيقاف إشعارات الجهاز':'تفعيل إشعارات الجهاز','notifications-toggle')}${btn('مركز التنبيهات','notices')}</div><small>لا نطلب الإذن إلا عند ضغط زر التفعيل. عند إعادة فتح التطبيق تظهر التذكيرات المستحقة التي لم تُقرأ.</small></section><section class="card"><h2>البيانات والنسخ الاحتياطي</h2><p class="subtitle">النسخة الفردية محفوظة في هذا المتصفح. قسم مساحتنا يضيف حسابًا اختياريًا ومشاركة مختارة بين الجهازين، ونسخة سحابية خاصة ترفعها وتنزلها يدويًا.</p><div class="actions" style="margin:18px 0">${btn('تصدير نسخة JSON','export','',false,'export')}${btn('استيراد نسخة','import')}${btn('سلة المحذوفات','trash')}${btn('تحديث البيانات','sync-latest')}</div><small>آخر تصدير: ${D.settings.lastExport?esc(new Date(D.settings.lastExport).toLocaleString('ar-SA-u-ca-gregory-nu-latn')):'لم تُصدّر نسخة بعد'}</small><div class="notice">للنقل إلى جهاز آخر: صدّر الملف ثم استورده هناك. الاستيراد يستبدل البيانات بعد عرض ملخص للتأكيد. نوصي بنسخة دورية؛ حذف بيانات المتصفح أو التصفح الخاص قد يزيل الحفظ. حافظ على نفس اسم ومكان ملف HTML عند فتحه محليًا.</div>${recoveryRaw?'<div class="notice warn">يوجد حفظ سابق تعذّرت قراءته. يمكنك تنزيله للاحتفاظ به. '+btn('تنزيل الحفظ السابق','recovery-export')+'</div>':''}<small>الحفظ: ${storageOK?'متاح':'غير متاح'} · الإصدار 3.0 · الاتصال السحابي اختياري من مساحتنا</small></section><section class="card"><h2>استخدام سريع</h2><div class="row"><span class="pill green">1</span><p>ابدأ من زر الإضافة في أي قسم، ثم احفظ بياناتك.</p></div><div class="row"><span class="pill green">2</span><p>سجّل الدفعات والجلسات بدل تعديل الإجماليات؛ يحسب مدار التقدم تلقائيًا.</p></div><div class="row"><span class="pill green">3</span><p>راجع الصفحة الرئيسية يوميًا والتقرير أسبوعيًا. البحث العلوي يشمل كل الأقسام.</p></div><div class="actions" style="margin-top:16px">${btn('التقرير الأسبوعي','go-reports')}${btn('تعديل الأهداف','goals-edit')}${btn('الاختصارات والمساعدة','shortcuts')}${btn('التحفيز والتشجيع','motivation-settings')}</div></section></div>`}
function searchPage(){let q=searchText.trim().toLocaleLowerCase('ar'),hit=(...s)=>s.join(' ').toLocaleLowerCase('ar').includes(q);let groups=[['المهام',D.tasks.filter(t=>hit(t.title,t.description,t.category)),t=>taskRow(t)],['الديون',D.debts.filter(d=>hit(d.name)),d=>`<div class="row"><div class="body"><b>${esc(d.name)}</b><p>${money(remaining(d))} متبقية</p></div>${btn('عرض وتعديل','debt-edit',d.id)}</div>`],['التمارين',D.exercises.filter(e=>hit(e.name,e.goal)),exerciseCard],['الكتب',D.books.filter(b=>hit(b.title,b.author)),b=>`<div class="row"><div class="body"><b>${esc(b.title)}</b><p>${esc(b.author)} · ${num(b.current)}/${num(b.total)} صفحة</p></div>${btn('عرض وتعديل','book-edit',b.id)}</div>`],['المصاريف',D.expenses.filter(e=>hit(e.name)),e=>`<div class="row"><b>${esc(e.name)} · ${money(e.amount)}</b>${btn('تعديل','expense-edit',e.id)}</div>`]];groups.push(['العادات',D.habits.filter(h=>hit(h.title,h.unit)),habitCard],['الأهداف الشخصية',D.personalGoals.filter(g=>hit(g.title,g.why,g.nextStep)),personalGoalCard],['إنجازات الأيام',D.wins.filter(x=>hit(x.text)),winCard]);return head('نتائج البحث','بحث عن «'+esc(searchText)+'»')+groups.filter(g=>g[1].length).map(([l,arr,fn])=>`<section class="card resultgroup"><h3>${l} (${num(arr.length)})</h3>${arr.map(fn).join('')}</section>`).join('')+(groups.every(g=>!g[1].length)?empty('search','لم نجد نتائج','جرّب كلمة أخرى من العنوان أو الوصف.','',''):'')}

document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select,[contenteditable=true]');if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#modal').open&&$('#editForm')){e.preventDefault();$('#editForm').requestSubmit();return}if(typing||e.ctrlKey||e.metaKey||e.altKey||$('#modal').open)return;if(e.key==='/'){e.preventDefault();$('#globalSearch').focus()}else if(e.key.toLowerCase()==='n'){e.preventDefault();editTask()}else if(e.key.toLowerCase()==='q'){e.preventDefault();quickLaunch()}});
window.addEventListener('beforeunload',e=>{if(modalDirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('click',e=>{let el=e.target.closest('button[data-act]');if(!el)return;let a=el.dataset.act,id=el.dataset.id;switch(a){case'quick-launch':quickLaunch();break;case'quick-workout':closeModal(true);startSession();break;case'task-batch':batchTasks();break;case'task-copy':duplicateTask(id);break;case'task-filter-reset':taskPriority='all';taskCategory='all';taskOrder='date';render();break;case'task-bulk-delay':bulkDelay();break;case'agenda-prev':agendaOffset-=7;render();break;case'agenda-next':agendaOffset+=7;render();break;case'agenda-today':agendaOffset=0;render();break;case'agenda-day':showAgenda(id);break;case'agenda-task':editTask();$('#f_date').value=id;break;case'agenda-workout':closeModal(true);startSession(id);break;case'trash':trashPanel();break;case'undo-delete':restoreDeleted(id);break;case'trash-remove':askDelete('حذف نهائي','لن يمكن استرجاع هذه العملية من السلة.',()=>D.trash=D.trash.filter(x=>x.id!==id));break;case'trash-empty':askDelete('إفراغ السلة','حذف كل عناصر السلة نهائيًا؟ لن تتأثر سجلاتك الحالية.',()=>D.trash=[]);break;case'budget-available':budgetFromAvailable();break;case'finance-export':financeCsv();break;case'exercise-copy':copyExercise(id);break;case'session-repeat':repeatSession(id);break;case'rest-custom':customRest();break;case'reading-quick':quickReading(id);break;case'book-status':{let b=D.books.find(b=>b.id===id);if(b&&b.status!=='done'){b.status=b.status==='paused'?'reading':'paused';commit('تم تحديث حالة الكتاب')}break}case'report-print':window.print();break;case'shortcuts':shortcuts();break;case'sync-latest':syncLatest();break;case'task-toggle':{let date=$('#modal').dataset.agendaDate;if(date&&$('#modal').open)setTimeout(()=>{if($('#modal').open&&$('#modal').dataset.agendaDate===date)showAgenda(date)},0);break}}});

function motiveCategory(){let mode=D.settings.motivationMode||'auto';if(mode!=='auto')return motivationWords[mode]?mode:'general';if(currentPage==='workout'&&D.restDays.includes(new Date().getDay()))return 'rest';return motivationWords[currentPage]?currentPage:'general'}
function motiveText(){let category=motiveCategory(),bank=motivationWords[category],hash=[...today()+category].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0);return bank[(hash+quoteOffset)%bank.length]}
function motivationPanel(){if(D.settings.motivation===false)return '';return `<aside class="motive" aria-label="عبارة تحفيزية"><span class="motiveMark" aria-hidden="true">✦</span><div class="body"><small>${D.settings.customQuote?'عبارتك الشخصية':'تذكير لطيف لك'}</small><p id="motiveText">${esc(D.settings.customQuote||motiveText())}</p>${D.settings.customQuote?`<small>${esc(motiveText())}</small>`:''}</div><div class="actions">${btn('عبارة أخرى','motive-next')}${btn('تخصيص','motivation-settings')}</div></aside>`}
function motivationSettings(){openModal('التحفيز على طريقتك',`<label class="togglelabel full"><input type="checkbox" name="enabled" ${D.settings.motivation!==false?'checked':''}>إظهار العبارات التحفيزية</label><label class="togglelabel full"><input type="checkbox" name="success" ${D.settings.successMessages!==false?'checked':''}>تشجيع قصير عند تسجيل إنجاز</label>`+field('mode','نوع العبارات',D.settings.motivationMode||'auto','select',{full:true,options:[['auto','حسب القسم تلقائيًا'],['general','تشجيع عام'],['tasks','المهام والإنجاز'],['money','تنظيم المال'],['workout','التمرين'],['book','القراءة'],['growth','الأهداف والعادات']]})+field('custom','عبارة شخصية تظهر لك دائمًا (اختياري)',D.settings.customQuote||'','textarea',{full:true,hint:'حتى 300 حرف. اتركها فارغة لاستخدام العبارات المتغيرة.'})+'<p class="full muted">العبارات مكتوبة للتشجيع وليست اقتباسات منسوبة لأشخاص. تتغير يوميًا، ويمكنك تغييرها بزر «عبارة أخرى».</p>',f=>{let custom=str(f,'custom');if(custom.length>300)throw Error('اجعل عبارتك 300 حرف أو أقل.');D.settings.motivation=f.has('enabled');D.settings.successMessages=f.has('success');D.settings.motivationMode=str(f,'mode');D.settings.customQuote=custom;return true})}
function queueEncouragement(kind){setTimeout(()=>{if(D.settings.successMessages===false||!storageOK||pendingExternal)return;const text={tasks:'أنجزت خطوة من يومك. أحسنت المتابعة.',money:'دفعتك مسجلة، وصورة السداد أوضح الآن.',workout:'سجّلت وقتك وجهدك. كل جلسة تُحتسب.',book:'صفحات جديدة أصبحت جزءًا من رحلتك.',habit:'وصلت إلى هدف العادة لهذا اليوم. خطوة تستحق التقدير.',goal:'وصلت إلى هدفك الشخصي. امنح هذا الإنجاز حقه.',win:'احتفظت بأثر جميل من يومك.'}[kind];if(text)toast('✦ '+text)},0)}
function scheduledHabit(h,date=today()){return !h.paused&&date>=h.startDate&&h.days.includes(parseDate(date).getDay())}
function habitAmount(h,date=today()){return D.habitLogs.find(x=>x.habitId===h.id&&x.date===date)?.amount||0}
function habitStreak(h){let date=today(),count=0;if(habitAmount(h,date)<h.target&&h.days.includes(parseDate(date).getDay()))date=addDays(date,-1);for(let i=0;i<36500&&date>=h.startDate;i++,date=addDays(date,-1)){if(!h.days.includes(parseDate(date).getDay()))continue;if(habitAmount(h,date)>=h.target)count++;else break}return count}
function habitWeek(){let expected=0,met=0;for(let h of D.habits.filter(h=>!h.paused))for(let date=weekStart();date<=today();date=addDays(date,1))if(scheduledHabit(h,date)){expected++;if(habitAmount(h,date)>=h.target)met++}return {expected,met}}
function dailyGrowthPanel(){let active=D.habits.filter(h=>scheduledHabit(h)),complete=active.filter(h=>habitAmount(h)>=h.target).length,win=D.wins.find(x=>x.date===today());return `<section class="card dailyGrowth"><div class="cardhead"><div><h2>خطوة لنفسك اليوم</h2><small>${active.length?num(complete)+' من '+num(active.length)+' عادات مكتملة':'ابدأ بعادة بسيطة أو احتفظ بإنجاز من يومك.'}</small></div><div class="actions">${btn('تطوّري وأهدافي','growth-open')}${btn(win?'تعديل إنجاز اليوم':'إنجاز اليوم','win-edit')}</div></div>${active.length?active.slice(0,3).map(h=>`<div class="minirow"><span><b>${esc(h.title)}</b><br><small>${num(habitAmount(h))} / ${num(h.target)} ${esc(h.unit)}</small></span>${habitAmount(h)>=h.target?'<span class="pill green">مكتملة</span>':btn('+ '+num(h.step),'habit-plus',h.id)}</div>`).join(''):''}${win?`<p class="winText">${esc(win.text)}</p>`:''}</section>`}
function growthPage(){let scheduled=D.habits.filter(h=>scheduledHabit(h)),week=habitWeek(),earned=badges().filter(b=>b.met).length;return head('تطوّرك يستحق أن تراه','عادات تناسب أيامك، وأهداف لها معنى، وإنجازات تحتفظ بها.',`<div class="actions">${btn('عادة جديدة','habit-edit','',true,'plus')}${btn('هدف شخصي','personal-goal-edit')}</div>`)+`<div class="stats">${stat('عادات اليوم المكتملة',num(scheduled.filter(h=>habitAmount(h)>=h.target).length)+' / '+num(scheduled.length),'الأيام غير المجدولة لا تُحسب فائتة','check')}${stat('التزام هذا الأسبوع',week.expected?num(Math.round(week.met/week.expected*100))+'%':'—',num(week.met)+' من '+num(week.expected)+' مرات مجدولة حتى اليوم','reports')}${stat('أهداف شخصية مكتملة',num(D.personalGoals.filter(g=>g.current>=g.target).length),'من '+num(D.personalGoals.length)+' أهداف','calendar')}${stat('أوسمة من سجلاتك',num(earned),'تشجيع على ما أنجزته فعليًا','home')}</div><div class="growthGrid"><div class="stack"><section class="card"><div class="cardhead"><h2>عاداتي</h2>${btn('إضافة عادة','habit-edit')}</div>${D.habits.length?D.habits.map(habitCard).join(''):empty('check','عادة صغيرة، تتكرر على طريقتك','حدد الهدف والأيام. لن نضيف أي عادة إلى بياناتك تلقائيًا.','habit-edit','أنشئ أول عادة')}<small>نسبة الأسبوع تعتمد العادات النشطة وجدولها الحالي من الأحد حتى اليوم. يمكنك تعديل الأيام أو إيقاف العادة مؤقتًا.</small></section><section class="card"><div class="cardhead"><h2>أهداف لها معنى</h2>${btn('إضافة هدف','personal-goal-edit')}</div>${D.personalGoals.length?D.personalGoals.map(personalGoalCard).join(''):empty('reports','ما الذي تريد الوصول إليه؟','حدد الهدف وسبب أهميته وأصغر خطوة تالية.','personal-goal-edit','أضف هدفك الأول')}</section></div><div class="stack"><section class="card"><div class="cardhead"><h2>إنجاز صغير من يومك</h2>${btn('اكتب إنجازًا','win-edit')}</div>${D.wins.length?D.wins.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(winCard).join(''):empty('edit','ما الشيء الذي فعلته اليوم؟','قد يكون مهمة أنهيتها أو قرارًا جيدًا أو وقتًا منحته لنفسك.','win-edit','اكتب إنجاز اليوم')}<small>يظهر آخر 30 يومًا مسجلًا؛ بقية السجلات تبقى في النسخة الاحتياطية والبحث.</small></section><section class="card"><div class="cardhead"><h2>أوسمة تشجيعية</h2>${btn('كيف تُحسب؟','badges-info')}</div><div class="badgeGrid">${badges().map(b=>`<div class="achievement ${b.met?'earned':''}"><b>${b.met?'✦':'○'}</b><span>${b.label}</span><small>${b.met?'تحققت من سجلاتك':'خطوة قادمة'}</small></div>`).join('')}</div><small>محسوبة من السجلات الحالية، دون نقاط وهمية أو مقارنة بالآخرين.</small></section><section class="card"><h2>بداية خفيفة</h2><p class="subtitle">اختر خطوة واحدة فقط إن كان يومك مزدحمًا.</p><div class="actions" style="margin-top:15px">${btn('أضف مهمة صغيرة','small-step')}${btn('خصّص عبارة تحفزك','motivation-settings')}</div></section></div></div>`}
function habitCard(h){let amount=habitAmount(h),scheduled=scheduledHabit(h),met=amount>=h.target;return `<article class="item" style="margin-bottom:13px" data-habit="${h.id}"><div class="itemtop"><div><h3>${esc(h.title)}</h3><small>${h.paused?'متوقفة مؤقتًا':scheduled?'مجدولة اليوم':'غير مجدولة لهذا اليوم'}</small></div><span class="pill ${met?'green':''}">${met?'هدف اليوم مكتمل':num(habitStreak(h))+' أيام التزام'}</span></div><div class="minirow"><span class="habitValue">${num(amount)} / ${num(h.target)}</span><small>${esc(h.unit)}</small></div>${progress(amount/h.target*100)}<div class="habitDays" aria-label="سجل الأسبوع">${days.map((day,i)=>{let date=addDays(weekStart(),i),active=date>=h.startDate&&h.days.includes(i),done=habitAmount(h,date)>=h.target;return `<span title="${day} · ${fmt(date)} · ${done?'مكتملة':active?'مجدولة':'غير مجدولة'}" class="${done?'met':!active||date>today()?'inactive':''}">${done?'✓':day.slice(0,1)}</span>`}).join('')}</div><div class="actions">${scheduled?btn('+ '+num(h.step)+' '+esc(h.unit),'habit-plus',h.id,true):''}${scheduled&&amount>0?btn('− '+num(h.step),'habit-minus',h.id):''}${btn('تسجيل يوم','habit-log',h.id)}${btn(h.paused?'استئناف':'إيقاف','habit-pause',h.id)}${btn('تعديل','habit-edit',h.id)}<button type="button" class="btn danger" data-act="habit-delete" data-id="${h.id}">حذف</button></div></article>`}
function editHabit(id){let h=D.habits.find(h=>h.id===id)||{title:'',target:1,unit:'مرة',step:1,days:[0,1,2,3,4,5,6],startDate:today(),paused:false};openModal(id?'تعديل العادة':'عادة جديدة',field('title','اسم العادة',h.title,'text',{required:true,full:true})+field('target','الهدف في اليوم المجدول',h.target,'number',{required:true,min:0.01})+field('unit','الوحدة (مرة، صفحة، كوب…)',h.unit,'text',{required:true})+field('step','الزيادة عند الضغط على +',h.step,'number',{required:true,min:0.01})+field('startDate','بداية المتابعة',h.startDate,'date',{required:true})+'<p class="full muted">اختر أيام المتابعة؛ بقية الأيام لا تظهر كالتزام فائت.</p>'+days.map((d,i)=>`<label class="togglelabel"><input type="checkbox" name="day${i}" ${h.days.includes(i)?'checked':''}>${d}</label>`).join(''),f=>{let selected=days.map((_,i)=>i).filter(i=>f.has('day'+i));if(!selected.length)throw Error('اختر يومًا واحدًا على الأقل.');let startDate=validDate(str(f,'startDate'),'بداية المتابعة');if(D.habitLogs.some(l=>l.habitId===id&&l.date<startDate))throw Error('توجد سجلات قبل تاريخ البداية الجديد. اختر تاريخًا يضم سجلاتك.');let v={...h,id:id||uid(),title:required(f,'title','اسم العادة'),target:positive(nval(f,'target'),'لهدف العادة'),unit:required(f,'unit','الوحدة'),step:positive(nval(f,'step'),'للزيادة'),days:selected,startDate};if(id)D.habits[D.habits.indexOf(h)]=v;else D.habits.push(v);return true})}

 if(F.seen){for(let n of F.notices)if(!F.seen.has(n.id)&&!n.read_at)toast('مساحتنا: '+n.message)}F.seen=new Set(F.notices.map(n=>n.id));sharedEventReminderCheck();F.lastRefresh=new Date().toISOString();F.status='متصل';F.error='';if(currentPage==='family'&&!$('#modal').open)render();else nav();
 }catch(e){if(epoch===F.epoch){F.error=familyError(e);F.status='تعذّر التحديث';if(currentPage==='family'&&!$('#modal').open)render()}}finally{F.refreshing=false}}
function familyName(id){return F.profiles.find(p=>p.user_id===id)?.display_name||(id===familyUID()?F.session?.user?.user_metadata?.display_name||'حسابي':'الشريك')}
function familyPartner(){return F.members.find(m=>m.user_id!==familyUID())?.user_id||null}
async function familyCheckPush(){F.pushEnabled=false;if(!F.session||!('serviceWorker'in navigator))return;try{const r=await navigator.serviceWorker.getRegistration('./'),sub=await r?.pushManager.getSubscription();if(sub){const rows=await familyRequest('/rest/v1/md_subscriptions?endpoint=eq.'+encodeURIComponent(sub.endpoint)+'&select=id&limit=1');F.pushEnabled=!!rows?.length}}catch{}}
function familyAccountStrip(){return familyUID()?`<div class="familyAccount"><span>حسابي: ${esc(familyName(familyUID()))}</span>${btn('مساحتنا','family-open')}</div>`:''}
function familyStatusText(){return F.lastRefresh?'آخر تحديث '+new Date(F.lastRefresh).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit'}):'لم تتم المزامنة بعد'}
function familyPage(){const uid=familyUID(),peer=familyPartner();const top=head('مساحتنا معًا','حسابان مستقلان، وتعاون تختارون حدوده.',`<div class="actions">${btn('دليل المشاركة','family-config')}${uid?btn('تحديث','family-refresh')+btn('أجهزتي','family-devices'):''}</div>`);if(!uid)return top+`<section class="card"><h2>${F.pendingInvite?'دعوة لمساحتكما':'الدخول مرة واحدة'}</h2><p class="subtitle">${F.invitePreview?'دعوة من '+esc(F.invitePreview.name)+'. ادخل لربط المساحة مرة واحدة.':'يبقى دخولك محفوظًا على الجهاز، وعضويتك مرتبطة بحسابك. لا تحتاج دعوة في كل زيارة.'}</p><div class="actions" style="margin:20px 0">${btn(F.invitePreview?'الدخول وربط المساحة':'الدخول عبر ChatGPT','family-login','',true)}</div>${F.inviteError?`<div class="notice warn">${esc(F.inviteError)}</div>`:''}${F.pendingInvite?'<div class="notice">بالضغط على «الدخول وربط المساحة» توافق على الانضمام لصاحب الدعوة المعروض. لن تُشارك بياناتك تلقائيًا.</div>':''}<small>اسمك المحلي لا يثبت هويتك؛ الدخول يؤكد الحساب، والمشاركة تحتاج دعوة وموافقة مستقلة. انقل بيانات النسخة الفردية بالتصدير والاستيراد بعد الدخول.</small></section>`;return top+weddingBanner()+sharedCalendarPanel()+`<div class="notice familyStatus"><span>${esc(welcomeTitle(D.settings.profileName||familyName(uid)))} · ${esc(F.status)} · ${esc(familyStatusText())}</span><div class="actions">${btn('تعديل اسمي','family-profile')}${F.error?btn('إعادة الدخول','family-login'):btn('أجهزتي','family-devices')}${btn('إلغاء دخول هذا الجهاز','family-logout')}</div></div>${F.error?`<div class="notice error">${esc(F.error)}</div>`:''}${F.shareConflict?'<div class="notice warn">نُشرت نسخة أحدث من حسابك بجهاز آخر. أوقفنا نشر هذا الجهاز؛ راجع إعدادات المشاركة قبل اعتماد نسخته.</div>':''}<div class="grid2"><div class="stack"><section class="card"><div class="cardhead"><h2>${peer?'المهام المشتركة':'اربط الشريك'}</h2>${F.familyId?btn('مهمة مشتركة','family-task-edit','',true,'plus'):''}</div>${!F.familyId?`<p class="muted">أنشئ مساحة خاصة بكما أو استخدم رابط الدعوة.</p><div class="actions" style="margin-top:16px">${btn('أنشئ مساحتنا','family-create','',true)}${btn('لدي دعوة','family-join')}</div>`:!peer?`<p class="muted">المساحة جاهزة. أرسل رابط الدعوة للشريك بالطريقة التي تختارها.</p><div class="actions" style="margin-top:15px">${btn('دعوة زوجتي برابط واحد','family-invite','',true)}${btn('إلغاء الدعوات السابقة','family-revoke-invites')}</div>`:''}${F.familyId&&F.tasks.length?F.tasks.map(familyTaskCard).join(''):peer?'<p class="muted">لا توجد مهام مشتركة بعد. أضف أول مهمة وحدد المسؤول عنها.</p>':''}</section>${peer?partnerPanel(peer):''}<section class="card"><div class="cardhead"><h2>خصوصيتي ومشاركتي</h2>${btn('خيارات المشاركة','family-sharing')}</div><p>${F.meta.approved?'المشاركة مفعلة من هذا الجهاز.':'لم تسمح لهذا الجهاز بنشر مهامك بعد.'}</p><div class="notice">المهام المعلّمة «شخصية» لا تُنشر. المالية خاصة افتراضيًا؛ تختار ما يظهر منها. ملاحظات الدفعات والاقتباسات وإنجازات اليوم لا تُنشر.</div>${F.familyId?`<div class="actions">${btn('اعتماد ونشر نسخة هذا الجهاز','family-publish')}${btn('مغادرة المساحة','family-leave')}</div>`:''}</section></div><div class="stack">${peer?`<section class="card"><h2>تنبيه أو كلمة طيبة</h2><p class="subtitle">يمكن للطرفين إرسال تذكير لطيف أو تشجيع أو طلب مساعدة.</p><div class="actions" style="margin-top:16px">${btn('أرسل للشريك','family-nudge','',true)}${btn('أحسنت، كمل!','family-cheer')}</div><small>فاصل 30 ثانية بين الرسائل اليدوية، وبحد أقصى 100 تنبيه يوميًا للحساب.</small></section>`:''}<section class="card"><div class="cardhead"><h2>وارد المساحة</h2><span class="pill green">${num(F.notices.filter(n=>!n.read_at).length)} جديد</span></div>${F.notices.length?F.notices.slice(0,50).map(n=>`<article class="row"><div class="body"><b>${esc(familyName(n.sender_id))}</b><p>${esc(n.message)}</p><small>${esc(new Date(n.created_at).toLocaleString('ar-SA-u-ca-gregory-nu-latn'))}</small></div>${!n.read_at?btn('تمت القراءة','family-read',n.id):'<span class="pill">مقروء</span>'}</article>`).join(''):'<p class="muted">ستظهر الرسائل وتحديثات المهام المشتركة هنا.</p>'}</section><section class="card"><h2>تنبيهات هذا الجهاز</h2><p class="subtitle">${F.pushEnabled?'مسجّل لاستقبال إشعارات المساحة.':'لم يُسجّل الجهاز لاستقبال Push بعد.'}</p><div class="actions" style="margin-top:15px">${btn('تفعيل تنبيهات المساحة','family-push-enable')}${btn('تعطيلها','family-push-disable')}</div><div class="notice warn">خدمة الإرسال مجهزة. بعد تفعيل Web Push على جهازك يمكن وصول تنبيه الشريك والتطبيق مغلق، لكن وصوله يعتمد على المتصفح وإعدادات الجهاز والشبكة. iPhone يحتاج إضافة التطبيق للشاشة الرئيسية. تذكيرات مهامك الفردية لا تزال تعمل أثناء فتح التطبيق فقط.</div><small>النص على شاشة القفل مخفي افتراضيًا. اختر إظهاره عند تفعيل الجهاز إن رغبت.</small></section><section class="card"><h2>نسختي الخاصة عبر الأجهزة</h2><p class="subtitle">نسخة كاملة تخص حسابك وحدك. الرفع والتنزيل يدويان لتراجع ما سيُستبدل.</p><div class="actions" style="margin-top:15px">${btn('رفع نسختي الخاصة','family-cloud-upload')}${btn('تنزيل نسختي الخاصة','family-cloud-download')}${btn('تنزيل نسخة ما قبل الاستبدال','family-before-backup')}</div><small>${F.doc?'النسخة السحابية '+num(F.doc.version)+' · '+esc(new Date(F.doc.updated_at).toLocaleString('ar-SA-u-ca-gregory-nu-latn')):'لا توجد نسخة سحابية لحسابك بعد.'}</small></section></div></div>`}
function familyTaskCard(t){let late=!t.done&&t.due_date<today();return `<article class="row"><button class="check ${t.done?'done':''}" data-act="family-task-toggle" data-id="${esc(t.id)}" aria-label="${t.done?'إعادة فتح':'إكمال'} المهمة المشتركة">${t.done?icon('check'):''}</button><div class="body"><h3 class="${t.done?'completed':''}">${esc(t.title)}</h3>${t.description?`<p>${esc(t.description)}</p>`:''}<div class="pills"><span class="pill ${late?'red':''}">${fmt(t.due_date,true)}${t.due_time?' · '+esc(t.due_time.slice(0,5)):''}</span><span class="pill">المسؤول: ${t.assigned_to?esc(t.assigned_to===familyUID()?'أنا':familyName(t.assigned_to)):'معًا'}</span></div></div><div class="actions">${btn('تعديل','family-task-edit',t.id)}${btn('حذف','family-task-delete',t.id)}</div></article>`}
function partnerPanel(peer){let row=F.snapshots.find(s=>s.user_id===peer),s=row?.payload;return `<section class="card"><div class="cardhead"><h2>مهام وتقدم ${esc(familyName(peer))}</h2><span class="pill">عرض فقط</span></div>${!s?'<p class="muted">لم ينشر الشريك بياناته بعد. يظهر فقط ما وافق على مشاركته.</p>':`<small>آخر نشر: ${esc(new Date(row.updated_at).toLocaleString('ar-SA-u-ca-gregory-nu-latn'))}${s.day&&s.day!==today()?' · هذه نسخة ليوم '+esc(s.day):''}</small>${s.scopes?.progress?`<div class="reportnums"><div><b>${num(s.stats?.tasks)}</b><small>مهام الأسبوع</small></div><div><b>${num(s.stats?.sessions)}</b><small>جلسات الأسبوع</small></div><div><b>${num(s.stats?.pages)}</b><small>صفحات الأسبوع</small></div></div>`:''}${s.scopes?.tasks?`<h3 style="margin-top:15px">المهام التي اختار مشاركتها</h3>${(s.tasks||[]).length?s.tasks.slice(0,100).map(t=>`<div class="row"><span class="pill ${t.done?'green':''}">${t.done?'✓':'○'}</span><div class="body"><b class="${t.done?'completed':''}">${esc(t.title)}</b><p>${esc(t.date||'')} ${esc(t.time||'')}</p>${t.description?`<p>${esc(t.description)}</p>`:''}</div></div>`).join(''):'<p class="muted">لا توجد مهام مشاركة.</p>'}`:''}${s.scopes?.finance?partnerFinancePanel(s.finance):''}${[['books','الكتب','total'],['habits','عادات اليوم','target'],['goals','الأهداف الشخصية','target']].map(([k,label,target])=>s.scopes?.[k]?`<h3 style="margin-top:15px">${label}</h3>${(s[k]||[]).map(x=>`<div class="minirow"><span>${esc(x.title)}<br><small>${num(x.current)} / ${num(x[target])} ${esc(x.unit||'صفحة')}</small></span><b>${num(Math.round((Number(x.current)||0)/Math.max(.01,Number(x[target])||1)*100))}%</b></div>`).join('')||'<p class="muted">لا توجد بيانات مشاركة.</p>'}`:'').join('')}`}</section>`}
function familyHomePanel(){if(!familyUID()||!F.familyId)return '';let due=F.tasks.filter(t=>!t.done&&t.due_date<=today());return weddingBanner()+`<section class="card dailyGrowth"><div class="cardhead"><div><h2>مساحتنا معًا</h2><small>${familyPartner()?esc(familyName(familyPartner())):'بانتظار انضمام الشريك'} · ${num(due.length)} مهام مشتركة لليوم أو متأخرة</small></div><div class="actions">${btn('تقويمنا','family-calendar')}${btn('فتح المساحة','family-open')}</div></div><small>${esc(familyStatusText())}</small></section>`}
let familyCalendarMonth=today().slice(0,7);
function annualDate(source,year){const original=parseDate(source),month=original.getMonth(),last=new Date(year,month+1,0).getDate();return localDate(new Date(year,month,Math.min(original.getDate(),last),12))}
function nextSharedDate(event,from=today()){if(!event.annual)return event.date;const y=parseDate(from).getFullYear();let date=annualDate(event.date,y);if(date<from)date=annualDate(event.date,y+1);return date<event.date?event.date:date}
function occursShared(event,date){return event.date===date||event.annual&&date>=event.date&&annualDate(event.date,parseDate(date).getFullYear())===date}
function weddingEvent(){return F.events.find(e=>e.kind==='wedding')}
function weddingMessage(event){const target=nextSharedDate(event),days=diffDays(target,today()),anniversary=event.date<today()&&event.annual;let entry=0;try{entry=Math.max(0,(Number(localStorage.getItem('madar.love.counter.'+KEY))||1)-1)}catch{}const group=days<0?['الله يديم بينكما المودة، وتكبر أجمل الذكريات يومًا بعد يوم.','الأيام التي جمعتكما تستحق الامتنان؛ الله يكتب لكما القادم أجمل.']:days===0?['اليوم فرحتكما؛ الله يجمعكما على خير ويجعل العمر بينكما مودة ورحمة.','جاء اليوم الجميل، وصار الانتظار ذكرى. الله يبارك فرحتكما.']:anniversary?['تنتظركما ذكرى وعدكما الجميل؛ الحب يكبر بما تصنعانه معًا كل يوم.','كل يوم يمضي يضيف إلى حكايتكما ذكرى تستحق الاحتفال.']:days<=7?['أيام قليلة وتكتمل الفرحة؛ اصبر على جميل الانتظار، فاللقاء قريب.','هدي قلبك، ما بقي إلا القليل على اليوم الذي تنتظرانه معًا.']:days<=30?['اقترب موعد الفرح؛ خذ الأيام بهدوء، وكل يوم يمر يقرّبكما أكثر.','ما عاد الحلم بعيدًا. رتّبا التفاصيل بحب، واتركا للفرحة مكانًا.']:days<=90?['الصبر يحلو حين يكون آخره لقاء من تحب؛ يومًا بعد يوم تقترب فرحتكما.','كل يوم انتظار خطوة إلى بيت يجمعكما؛ اطمئنا وخذا الاستعداد على مهل.']:['طول الانتظار لا ينقص جمال اللقاء؛ اصبرا، وأكملا خطواتكما بحب وطمأنينة.','للأيام الجميلة موعد، ولكل يوم يمر معنى: أنكما أقرب إلى فرحتكما.'];return group[entry%group.length]}
function weddingBanner(compact=false){const event=weddingEvent();if(!event)return '';const target=nextSharedDate(event),days=diffDays(target,today()),anniversary=event.annual&&event.date<today(),title=anniversary?'ذكرى زواجنا':'يوم زواجنا',label=days===0?'اليوم هو يومكما الجميل':days>0?'باقي '+num(days)+' يومًا':'مضى '+num(-days)+' يومًا على موعدكما';return `<section class="${compact?'notice':'card weddingBanner'}"><div class="cardhead"><div><small>موعد واحد يجمعكما</small><h2>${title} · ${label}</h2></div>${compact?'':btn('تعديل الموعد','family-wedding')}</div><p>${esc(weddingMessage(event))}</p><small>${fmt(target,true)}${anniversary?' · تاريخ الزواج '+fmt(event.date,true):''}</small></section>`}
function sharedCalendarPanel(){if(!F.familyId)return '';const first=familyCalendarMonth+'-01',date=parseDate(first),year=date.getFullYear(),month=date.getMonth(),offset=date.getDay(),length=new Date(year,month+1,0).getDate(),cells=[];for(let n=0;n<offset;n++)cells.push('<span aria-hidden="true"></span>');for(let day=1;day<=length;day++){const current=localDate(new Date(year,month,day,12)),events=F.events.filter(e=>occursShared(e,current)),wedding=events.some(e=>e.kind==='wedding');cells.push(`<button type="button" class="sharedCalDay ${current===today()?'today':''} ${wedding?'weddingDay':''}" data-act="family-calendar-day" data-date="${current}" aria-label="${esc(fmt(current,true))}، ${num(events.length)} مواعيد"><b>${num(day)}</b><small>${wedding?'♥':events.length?num(events.length)+' موعد':'·'}</small></button>`)}return `<section class="card sharedCalendar" id="sharedCalendar"><div class="cardhead"><div><h2>تقويمنا</h2><small>المواعيد هنا مشتركة بينكما وقابلة للتعديل من الطرفين.</small></div><div class="actions">${btn('موعد جديد','family-event-edit','',true)}${btn(weddingEvent()?'يوم زواجنا':'تحديد يوم زواجنا','family-wedding')}</div></div><div class="calendarNav"><button type="button" class="btn small" data-act="family-calendar-prev">الشهر السابق</button><b>${new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'}).format(date)}</b><div class="actions">${btn('اليوم','family-calendar-today')}${btn('الشهر التالي','family-calendar-next')}</div></div><div class="sharedCalGrid">${days.map(d=>`<small class="calWeekday">${d}</small>`).join('')}${cells.join('')}</div>${sharedUpcoming()}<div class="notice">تذكير الموعد يعمل داخل التطبيق. زر «تقويم الجهاز» يضيف الموعد والتنبيه إلى تقويمك كبديل عند إغلاق التطبيق. تنبيهات إنشاء الموعد وتعديله ترسل للشريك عبر خدمة Push إذا فعّلها.</div></section>`}
function sharedUpcoming(){const rows=F.events.map(e=>({event:e,date:nextSharedDate(e)})).filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)||(a.event.time||'').localeCompare(b.event.time||'')).slice(0,5);return `<h3 style="margin-top:18px">مواعيدكما القادمة</h3>${rows.length?rows.map(({event,date})=>sharedEventCard(event,date)).join(''):'<p class="muted">لا توجد مواعيد قادمة؛ أضيفا موعدًا أو يوم زواجكما.</p>'}`}
function sharedEventCard(event,date=nextSharedDate(event)){return `<article class="row"><div class="body"><b>${esc(event.title)}</b><p>${fmt(date,true)}${event.time?' · '+esc(event.time):''}${event.annual?' · يتكرر سنويًا':''}</p>${event.description?`<p>${esc(event.description)}</p>`:''}<small>تذكير داخل التطبيق ${event.reminder_days?'قبل '+num(event.reminder_days)+' يومًا':'في نفس اليوم'}</small></div><div class="actions">${btn('تعديل','family-event-edit',event.id)}${btn('تقويم الجهاز','family-event-ics',event.id)}${btn('حذف','family-event-delete',event.id)}</div></article>`}
function sharedCalendarDay(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;const events=F.events.filter(e=>occursShared(e,date));openModal('تقويمنا · '+fmt(date,true),`<div>${events.length?events.map(e=>sharedEventCard(e,date)).join(''):'<p class="muted">لا يوجد موعد في هذا اليوم.</p>'}<button type="button" class="btn primary" data-act="family-event-on-day" data-date="${date}">إضافة موعد لهذا اليوم</button></div>`)}
function familyEditEvent(id,wedding=false,date=today()){if(!F.familyId){go('family');toast('اربط المساحة أولًا لإضافة موعد مشترك.');return}let event=id?F.events.find(e=>e.id===id):wedding?weddingEvent():null;event=event||{id:null,title:wedding?'يوم زواجنا':'',description:'',date,time:'',annual:!!wedding,kind:wedding?'wedding':'event',reminder_days:1,revision:0};const kind=event.kind;openModal(kind==='wedding'?'يوم زواجنا · تاريخ واحد لكما':event.id?'تعديل موعد مشترك':'موعد في تقويمنا',field('title','الموعد',event.title,'text',{required:true,full:true})+field('date','التاريخ الميلادي',event.date,'date',{required:true})+field('time','الوقت بحسب جهازك (اختياري)',event.time||'','time')+field('description','ملاحظة مشتركة',event.description,'textarea',{full:true})+field('reminder','التذكير داخل التطبيق',event.reminder_days,'select',{options:[[0,'في نفس اليوم'],[1,'قبل يوم'],[3,'قبل 3 أيام'],[7,'قبل أسبوع'],[14,'قبل أسبوعين'],[30,'قبل شهر تقريبًا']],full:true})+`<label class="togglelabel full"><input type="checkbox" name="annual" ${event.annual?'checked':''}>${kind==='wedding'?'تكرار ذكرى الزواج سنويًا بعد الموعد الأول':'التكرار سنويًا'}</label><div class="notice full">يرى الشريك هذا الموعد، ويستطيع تعديله. ${kind==='wedding'?'يوجد يوم زواج واحد للمساحة؛ تعديل التاريخ يحدثه للطرفين.':''}</div>`,async f=>{const result=await familyRPC('md_save_event',{p_id:event.id,p_expected:event.revision,p_data:{kind,title:required(f,'title','عنوان الموعد'),date:validDate(str(f,'date'),'الموعد'),time:str(f,'time'),description:str(f,'description'),annual:f.has('annual'),reminder_days:nval(f,'reminder')}});familyTryPush(result.notice_id);await familyRefresh(true);familyCalendarMonth=str(f,'date').slice(0,7);return true},'حفظ لكلا الحسابين');if(kind==='wedding')$('#f_title').readOnly=true}
function familyDeleteEvent(id){const event=F.events.find(e=>e.id===id);if(!event)return;openModal('حذف موعد مشترك',`<p class="full">سيُحذف «${esc(event.title)}» من تقويمكما معًا. إذا سبق تصديره لتقويم الجهاز، احذفه من هناك أيضًا.</p>`,async()=>{const result=await familyRPC('md_delete_event',{p_id:id,p_expected:event.revision});familyTryPush(result.notice_id);await familyRefresh(true);return true},'حذف من تقويمنا')}
function sharedICSEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\r?\n|\r/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function sharedICS(event){const d=event.date.replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Madar//Shared Calendar//AR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+event.id+'@madar-calendar','SEQUENCE:'+event.revision,'DTSTAMP:'+stamp];if(event.time){const start=d+'T'+event.time.replace(':','')+'00';lines.push('DTSTART:'+start,'DURATION:PT1H')}else lines.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(event.date,1).replace(/-/g,''));lines.push('SUMMARY:'+sharedICSEscape(event.title),'DESCRIPTION:'+sharedICSEscape(event.description));if(event.annual){const p=parseDate(event.date),month=p.getMonth()+1,day=p.getDate();lines.push(month===2&&day===29?'RRULE:FREQ=YEARLY;BYMONTH=2;BYMONTHDAY=28,29;BYSETPOS=-1':'RRULE:FREQ=YEARLY;BYMONTH='+month+';BYMONTHDAY='+day)}lines.push('BEGIN:VALARM','TRIGGER:'+(event.reminder_days?'-P'+event.reminder_days+'D':'-PT0M'),'ACTION:DISPLAY','DESCRIPTION:'+sharedICSEscape(event.title),'END:VALARM','END:VEVENT','END:VCALENDAR');return lines.map(line=>{const output=[];let part='',bytes=0;for(const c of line){const size=new TextEncoder().encode(c).length;if(bytes+size>73){output.push(part);part=' '+c;bytes=1+size}else{part+=c;bytes+=size}}output.push(part);return output.join('\r\n')}).join('\r\n')+'\r\n'}
function exportSharedEvent(id){const event=F.events.find(e=>e.id===id);if(event)download(sharedICS(event),'Madar-shared-'+event.id+'.ics','text/calendar;charset=utf-8')}
function sharedEventReminderCheck(){if(!F.familyId)return;F.meta.calendarSeen=F.meta.calendarSeen||{};let changed=false;for(const event of F.events){const target=nextSharedDate(event),left=diffDays(target,today()),key=event.id+'|'+event.revision+'|'+target+'|'+left;if(left<0||![0,event.reminder_days].includes(left)||F.meta.calendarSeen[key])continue;if(left===0&&event.time&&new Date().toTimeString().slice(0,5)<event.time)continue;F.meta.calendarSeen[key]=Date.now();changed=true;const message=(left?'باقي '+num(left)+' يومًا: ':'اليوم: ')+event.title;D.notices.unshift({id:uid(),title:'تقويمنا · '+message,date:new Date().toISOString(),read:false});toast(message);if(F.pushEnabled&&'Notification'in window&&Notification.permission==='granted')try{const n=new Notification('مدار · تقويمنا',{body:message,tag:'calendar-'+event.id});n.onclick=()=>{window.focus();go('family')}}catch{}}if(changed){const entries=Object.entries(F.meta.calendarSeen).sort((a,b)=>b[1]-a[1]).slice(0,1000);F.meta.calendarSeen=Object.fromEntries(entries);persistFamilyMeta();save()}}
function changeSharedMonth(delta){familyCalendarMonth=addMonths(familyCalendarMonth+'-01',delta).slice(0,7);render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const id=b.dataset.id;switch(b.dataset.act){case'family-calendar-prev':changeSharedMonth(-1);break;case'family-calendar-next':changeSharedMonth(1);break;case'family-calendar-today':familyCalendarMonth=today().slice(0,7);render();break;case'family-calendar-day':sharedCalendarDay(b.dataset.date);break;case'family-event-on-day':familyEditEvent(null,false,b.dataset.date);break;case'family-calendar':go('family');document.getElementById('sharedCalendar')?.scrollIntoView({behavior:'smooth',block:'start'});break;case'family-event-edit':familyEditEvent(id);break;case'family-wedding':familyEditEvent(null,true);break;case'family-event-delete':familyDeleteEvent(id);break;case'family-event-ics':exportSharedEvent(id);break}});

function familyConfigForm(){openModal('المشاركة جاهزة',`<p class="full">خدمة الحفظ والمشاركة مربوطة مسبقًا. لا تحتاج إلى حساب خدمة بيانات أو نسخ أي مفاتيح.</p><p class="full">من رابط GitHub Pages: يدخل كل واحد بحساب ChatGPT، ثم تنشئ مساحة وترسل رابط دعوتها للشريك. بعدها يختار كل طرف ما يشاركه.</p><p class="full muted">التحديث خلال 15 ثانية أثناء فتح التطبيق. فعّل إشعارات المساحة على كل جهاز إذا رغبت بتنبيه خارج التطبيق. يعتمد الوصول على دعم وإعدادات النظام والاتصال.</p><a class="btn full" href="./setup.html" target="_blank" rel="noopener">دليل رفع الملفات</a>`)}
async function familyAuthForm(){try{if(location.protocol!=='https:'||!crypto.subtle)throw Error('ارفع الملفات إلى GitHub Pages وافتح رابط HTTPS لتسجيل الدخول.');const bytes=crypto.getRandomValues(new Uint8Array(32)),verifier=familyBase64(bytes),state=familyBase64(crypto.getRandomValues(new Uint8Array(32))),challenge=familyBase64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)))),returnURL=location.href.split('#')[0].split('?')[0];sessionStorage.setItem('madar.connect.pkce',JSON.stringify({verifier,state,returnURL,name:D.settings.profileName||'',replaceToken:F.session?.access_token||'',joinConsent:!!F.pendingInvite&&!!F.invitePreview,joinCode:F.pendingInvite||''}));location.assign(MADAR_SERVICE+'/connect?'+new URLSearchParams({return_url:returnURL,challenge,state}).toString())}catch(e){toast(e.message,true)}}
function familyBase64(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function familyRecovery(){familyConfigForm()}
function familyPassword(){familyConfigForm()}
async function familyLogout(){if(!window.confirm('تسجيل الخروج؟ تبقى بيانات حسابك محفوظة محليًا لحين عودتك.'))return;try{await familyDisablePush(false);await familyRequest('/auth/v1/logout',{method:'POST'})}catch{}F.session=null;familyStore(FAMILY_KEYS.session,null);await rememberedQueue;familyLocalAccount(null);F.status='غير متصل';render()}
async function familyCreateInvite(){const invite=await familyRPC('md_create_invite'),url=location.href.split('#')[0].split('?')[0]+'#pair='+invite.code;F.meta.inviteURL=url;persistFamilyMeta();openModal('دعوة واحدة، ثم تفتحان التطبيق مباشرة',`<div class="notice full">هذا الرابط يبقى نفسه حتى تنضم زوجتك أو تلغيه أنت. لا يحتاج تجديدًا أو إعادة إرسال في كل زيارة. بعد الربط يكفي فتح الموقع من الجهاز نفسه.</div>${field('inviteLink','رابط خاص لزوجتك',url,'textarea',{full:true})}<div class="actions">${btn('مشاركة الرابط','family-share-invite','',true)}${btn('نسخ الرابط','family-copy-invite')}</div><small>احتفظ بالرابط لشريكتك فقط. تستطيع إلغاءه قبل استخدامه. إن مُسح دخول الجهاز، الدخول بالحساب نفسه يعيد المساحة المرتبطة دون دعوة أخرى.</small>`)}

async function familyCompleteJoin(code){await familyRPC('md_join_family',{p_code:code});F.pendingInvite='';F.invitePreview=null;familyStore(FAMILY_KEYS.pending,null);await familyRefresh(true);requestDurableStorage();toast('تم الربط. الزيارات القادمة تفتح مساحتكما مباشرة.');}
function familyJoinForm(){if(F.familyId){F.pendingInvite='';familyStore(FAMILY_KEYS.pending,null);toast('مساحتك مرتبطة بالفعل؛ لا تحتاج دعوة أخرى.');return}if(F.pendingInvite&&F.invitePreview){const code=F.pendingInvite;openModal('ربط المساحة مرة واحدة',`<p class="full">سترتبط بمساحة ${esc(F.invitePreview.name)}. لا تُنشر مهامك أو ماليتك تلقائيًا؛ تختار ما تشاركه لاحقًا.</p>`,async()=>{await familyCompleteJoin(code);return true},'ربط المساحة مرة واحدة');return}openModal('رابط الدعوة',field('code','الصق رابط الدعوة',F.pendingInvite||'','textarea',{required:true,full:true}),async f=>{let code=str(f,'code');if(code.includes('#'))code=new URL(code).hash.slice(1).split('pair=')[1]?.split('&')[0]||'';if(!/^[a-f0-9]{64}$/.test(code))throw Error('أدخل رابط الدعوة الصحيح.');await familyCompleteJoin(code);return true},'ربط المساحة')}
function familyManageDevices(){openModal('أجهزتي المرتبطة',`<p>يبقى الدخول محفوظًا حتى تسجل الخروج أو تلغي ربط الجهاز. إغلاق التطبيق لا يسجل خروجك.</p>${F.devices.map(d=>`<article class="row"><div class="body"><b>${d.current?'هذا الجهاز':'جهاز مرتبط'}</b><p dir="ltr">${esc(d.origin)}</p><small>${esc(new Date(d.created_at).toLocaleString('ar-SA-u-ca-gregory-nu-latn'))}</small></div>${btn('إلغاء ربطه','family-device-remove',d.id)}</article>`).join('')}<div class="notice">إلغاء الربط يمنع الاتصال اللاحق؛ لا يمسح نسخة بيانات سبق حفظها على الجهاز. إذا مُسحت بيانات متصفحك، ادخل بحساب ChatGPT نفسه لاستعادة عضوية المساحة دون دعوة.</div>`)}
function familyRemoveDevice(id){const device=F.devices.find(d=>d.id===id);if(!device)return;openModal('إلغاء ربط جهاز',`<p class="full">${device.current?'سيطلب هذا الجهاز تسجيل الدخول من جديد.':'سيتوقف هذا الجهاز عن المزامنة واستقبال تنبيهات المساحة.'} تبقى عضويتك في المساحة محفوظة في حسابك.</p>`,async()=>{await familyRPC('md_revoke_device',{p_id:id});if(device.current){try{await familyDisablePush(false)}catch{}F.session=null;familyStore(FAMILY_KEYS.session,null);await rememberedQueue;familyLocalAccount(null)}else await familyRefresh(true);return true},'إلغاء الربط')}

function sharedFinancePayload(options={}){const out={currency:D.settings.currency,debts:[],expenses:[]},month=today().slice(0,7);for(const d of D.debts.filter(d=>(options.debts||[]).includes(d.id))){const row={id:d.id,name:d.name};if(options.balances){row.original=d.original+(d.cost||0);row.remaining=remaining(d);row.installment=d.installment||0}if(options.dates&&d.due)row.due=d.due;if(options.paid)row.paidThisMonth=round(D.payments.filter(p=>p.debtId===d.id&&p.date.startsWith(month)).reduce((s,p)=>s+p.amount,0));out.debts.push(row)}for(const e of D.expenses.filter(e=>(options.expenses||[]).includes(e.id)))out.expenses.push({id:e.id,name:e.name,amount:e.amount,recurring:!!e.recurring,...options.dates?{date:e.date}:{}});for(const k of ['budget','income','savings'])if(options[k])out[k]=D.settings[k]||0;return out}
function financeOptionsFromForm(f){return {debts:D.debts.filter(d=>f.has('fd_'+d.id)).map(d=>d.id),expenses:D.expenses.filter(e=>f.has('fe_'+e.id)).map(e=>e.id),...Object.fromEntries(['balances','dates','paid','budget','income','savings'].map(k=>[k,f.has('fm_'+k)]))}}
function financeControls(){const f=F.meta.finance||{};const check=(key,label,on)=>`<label class="togglelabel full"><input type="checkbox" name="${esc(key)}" ${on?'checked':''}>${label}</label>`;return `<fieldset class="full shareFinance"><legend>تفاصيل مالية أختار مشاركتها</legend>${check('finance','تفعيل مشاركة المالية المختارة فقط',F.meta.scopes?.finance)}<p class="muted">كل دين أو مصروف جديد يبقى خاصًا حتى تختاره بنفسك. عدم اختيار سجل يعني عدم نشر اسمه أو مبلغه، ولا يدخل في أي إجمالي مشترك.</p><h3>الديون التي تسمح بعرضها</h3>${D.debts.length?D.debts.map(d=>check('fd_'+d.id,esc(d.name),(f.debts||[]).includes(d.id))).join(''):'<p class="muted">لا توجد ديون. لن ننشئ بيانات أو نشارك شيئًا تلقائيًا.</p>'}<h3>حقول الديون المختارة</h3>${check('fm_balances','المبالغ الأصلية والمتبقية والقسط المقترح',f.balances)}${check('fm_paid','ما سددته هذا الشهر لهذه الديون فقط، دون ملاحظات الدفعات',f.paid)}${check('fm_dates','التواريخ للديون والمصاريف التي أختارها',f.dates)}<h3>المصاريف التي تسمح بعرضها</h3>${D.expenses.length?D.expenses.map(e=>check('fe_'+e.id,esc(e.name),(f.expenses||[]).includes(e.id))).join(''):'<p class="muted">لا توجد مصاريف.</p>'}<h3>قيم منفصلة، اختيارية</h3>${check('fm_budget','ميزانية السداد الشهرية',f.budget)}${check('fm_income','الدخل التقريبي',f.income)}${check('fm_savings','هدف الادخار الشهري',f.savings)}<div class="notice warn">لا تُنشر ملاحظات الدفعات أو سجلها التفصيلي. اضغط «حفظ ونشر اختياراتي» لتطبيق الإخفاء أو الإظهار على آخر نسخة مشاركة. يلزم الاتصال.</div></fieldset>`}
function partnerFinancePanel(value){const p=value||{},unit=esc(p.currency||'SAR'),cash=n=>num(n)+' '+unit;return `<div class="sharedFinanceView"><h3>المالية التي اختار مشاركتها</h3>${(p.debts||[]).map(d=>`<article class="row"><div class="body"><b>${esc(d.name)}</b>${d.remaining!==undefined?`<p>المتبقي ${cash(d.remaining)} · الإجمالي ${cash(d.original)} · القسط ${cash(d.installment)}</p>`:''}${d.due?`<small>الاستحقاق ${fmt(d.due,true)}</small>`:''}${d.paidThisMonth!==undefined?`<p>سداد هذا الشهر: ${cash(d.paidThisMonth)}</p>`:''}</div></article>`).join('')}${(p.expenses||[]).map(e=>`<div class="minirow"><span>${esc(e.name)}${e.date?' · '+fmt(e.date,true):''}${e.recurring?' · شهري':''}</span><b>${cash(e.amount)}</b></div>`).join('')}${[['budget','ميزانية السداد'],['income','الدخل التقريبي'],['savings','هدف الادخار']].map(([k,label])=>p[k]!==undefined?`<div class="minirow"><span>${label}</span><b>${cash(p[k])}</b></div>`:'').join('')}${!(p.debts||[]).length&&!(p.expenses||[]).length&&!['budget','income','savings'].some(k=>p[k]!==undefined)?'<p class="muted">لا توجد بيانات مالية مختارة للعرض.</p>':''}<small>هذه بيانات مختارة فقط. لا تعرض إجماليًا يشمل السجلات الخاصة.</small></div>`}
function financialPrivacyPanel(){const own=F.snapshots.find(s=>s.user_id===familyUID())?.payload,shown=own?.scopes?.finance?own.finance?.debts?.length||0:0;return `<section class="card financialPrivacy"><div class="cardhead"><div><h2>ما يظهر للشريك من ماليتي؟</h2><small>${familyUID()?num(shown)+' ديون في آخر نسخة مالية منشورة. البقية خاصة.':'المالية محلية وخاصة حتى تدخل وتختار مشاركتها.'}</small></div>${btn('اختيار الإخفاء والإظهار','finance-sharing')}</div><p class="muted">تختار كل دين ومصروف والحقول التي تظهر. لا تُشارك البيانات الجديدة تلقائيًا.</p></section>`}
